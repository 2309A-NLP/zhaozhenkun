<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能测试</title>
    <style>
        body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(135deg,#f6efe5,#eff7f4); color:#1f2937; }
        .wrap { max-width:1280px; margin:0 auto; padding:24px; }
        .panel,.card { background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.7); border-radius:24px; box-shadow:0 18px 40px rgba(15,23,42,.12); backdrop-filter:blur(18px); }
        .panel { padding:24px; margin-bottom:18px; }
        .toolbar,.form-grid { display:flex; flex-wrap:wrap; gap:12px; }
        .form-grid { display:grid; grid-template-columns:2fr 140px 140px auto; }
        h1 { margin:0 0 8px; }
        .muted { color:#6b7280; line-height:1.7; }
        input { width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(15,23,42,.08); background:#fff; }
        .btn { border:none; border-radius:16px; padding:12px 16px; cursor:pointer; font:inherit; font-weight:800; }
        .primary { background:linear-gradient(135deg,#0f766e,#ea580c); color:#fff; }
        .secondary { background:#fff; border:1px solid rgba(15,23,42,.08); }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:18px; }
        .card { padding:18px; }
        .label { color:#6b7280; font-size:13px; margin-bottom:8px; }
        .value { font-size:34px; font-weight:800; }
        table { width:100%; border-collapse:collapse; }
        th,td { padding:12px 10px; border-bottom:1px solid rgba(15,23,42,.08); text-align:left; font-size:14px; }
        @media (max-width:860px) { .form-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="wrap">
        <section class="panel">
            <h1>性能测试</h1>
            <p class="muted">对当前检索链路做串行性能测试，观察平均耗时、P95、记忆访问和检索阶段耗时。这里的测试会复用你现有代码里的 Redis / Milvus / 混合检索 / BGE 组件。</p>
            <div class="toolbar" style="margin-top:14px;">
                <button class="btn secondary" onclick="window.location.href='/chat'">返回聊天</button>
                <button class="btn secondary" onclick="window.location.href='/stress'">压力测试</button>
                <button class="btn secondary" onclick="window.location.href='/retrieval'">混合检索</button>
                <button class="btn secondary" onclick="window.location.href='/load-balancer'">负载均衡</button>
            </div>
        </section>

        <section class="panel">
            <div class="form-grid">
                <input id="query" value="兰蔻小黑瓶具备哪些基础功能？" placeholder="输入测试问题">
                <input id="rounds" type="number" value="12" min="1" max="80" placeholder="轮数">
                <input id="topk" type="number" value="5" min="1" max="10" placeholder="TopK">
                <button class="btn primary" onclick="runTest()">开始测试</button>
            </div>
        </section>

        <section id="cards" class="grid"></section>

        <section class="panel">
            <h3>逐轮结果</h3>
            <table>
                <thead>
                    <tr>
                        <th>轮次</th>
                        <th>总耗时</th>
                        <th>检索耗时</th>
                        <th>记忆耗时</th>
                        <th>召回模式</th>
                        <th>命中数</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </section>
    </div>

    <script>
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML; }
        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || `请求失败: ${response.status}`);
            return data;
        }

        function renderCards(result) {
            const cards = [
                ['平均耗时', `${result.avg_ms} ms`],
                ['P95', `${result.p95_ms} ms`],
                ['最小耗时', `${result.min_ms} ms`],
                ['最大耗时', `${result.max_ms} ms`],
                ['平均检索耗时', `${result.avg_retrieval_ms} ms`],
                ['平均记忆耗时', `${result.avg_memory_ms} ms`]
            ];
            document.getElementById('cards').innerHTML = cards.map(([label, value]) => `
                <div class="card">
                    <div class="label">${escapeHtml(label)}</div>
                    <div class="value">${escapeHtml(value)}</div>
                </div>
            `).join('');
        }

        function renderRows(rows) {
            document.getElementById('tbody').innerHTML = rows.map(row => `
                <tr>
                    <td>${row.round}</td>
                    <td>${row.total_ms} ms</td>
                    <td>${row.retrieval_ms} ms</td>
                    <td>${row.memory_ms} ms</td>
                    <td>${escapeHtml((row.modes || []).join(' / ') || '无')}</td>
                    <td>${row.hit_count}</td>
                </tr>
            `).join('');
        }

        async function runTest() {
            const data = await fetchJson('/api/performance/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: document.getElementById('query').value.trim(),
                    rounds: Number(document.getElementById('rounds').value || 12),
                    top_k: Number(document.getElementById('topk').value || 5)
                })
            });
            renderCards(data.result);
            renderRows(data.result.rows || []);
        }

        runTest();
    </script>
</body>
</html>
