<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 智能体系统 — 思维导图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;background:#f0f4f8;overflow:hidden;height:100vh}
#mindmap{width:100%;height:100vh;cursor:grab}
#mindmap:active{cursor:grabbing}
.node circle{fill:#fff;stroke-width:3}
.node text{font-size:12px;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.node .root-text{font-size:18px;font-weight:700}
.node .branch-text{font-size:14px;font-weight:600}
.link{fill:none;stroke:#cbd5e1;stroke-width:2}
.link.primary{stroke:#1e3a5f;stroke-width:3}
.tooltip{position:fixed;background:#1e293b;color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
.legend{position:fixed;bottom:20px;right:24px;background:rgba(255,255,255,.92);border-radius:12px;padding:14px 18px;box-shadow:0 2px 16px rgba(0,0,0,.08);font-size:11px;z-index:5}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.title-bar{position:fixed;top:0;left:0;right:0;padding:10px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);z-index:4;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e2e8f0}
.title-bar h1{font-size:16px;color:#1e3a5f}
.title-bar .badge{font-size:10px;background:#06b6d4;color:#fff;padding:3px 8px;border-radius:10px}
.controls{position:fixed;bottom:20px;left:20px;display:flex;gap:8px;z-index:5}
.controls button{width:36px;height:36px;border-radius:50%;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:18px;transition:all .2s}
.controls button:hover{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
</style>
</head>
<body>

<div class="title-bar">
  <h1>🧠 AI Agent 智能体系统 — 思维导图</h1>
  <span class="badge">V2.2</span>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1e3a5f"></div>核心引擎</div>
  <div class="legend-item"><div class="legend-dot" style="background:#0ea5e9"></div>五大工具</div>
  <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div>数据层</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>前端/部署</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>优化历程</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>V2.2修复</div>
</div>

<div class="controls">
  <button onclick="zoomIn()" title="放大">+</button>
  <button onclick="zoomOut()" title="缩小">−</button>
  <button onclick="resetView()" title="重置">⟳</button>
</div>

<div id="mindmap"></div>
<div class="tooltip" id="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const data = {
  name: "AI Agent\n智能体系统",
  color: "#1e3a5f",
  children: [
    {
      name: "Agent Core\n核心引擎",
      color: "#1e3a5f",
      children: [
        {name:"意图识别\nDeepSeek V4",color:"#334e6e",children:[
          {name:"JSON结构化输出",color:"#4a6180",children:[{name:"tool/query/reason",color:"#6b7f99"}]},
          {name:"5工具分类路由",color:"#4a6180"},
          {name:"降级文本匹配",color:"#4a6180"},
          {name:"reasoning_content兜底",color:"#ef4444"},
        ]},
        {name:"工具路由\nTOOL_REGISTRY",color:"#334e6e",children:[
          {name:"pre_recognized_tool\n避免重复API",color:"#4a6180"},
          {name:"call_tool()",color:"#4a6180"},
        ]},
        {name:"多轮对话\nSession管理",color:"#334e6e",children:[
          {name:"MAX_HISTORY=10",color:"#4a6180"},
          {name:"user/assistant交替",color:"#4a6180"},
        ]},
        {name:"通用兜底\n_general_chat",color:"#334e6e",children:[
          {name:"max_tokens 2048",color:"#4a6180"},
          {name:"至少2-3句话",color:"#4a6180"},
        ]},
        {name:"答案格式化\nprocess_query",color:"#334e6e"},
      ]
    },
    {
      name: "五大工具集\nTOOLS",
      color: "#0ea5e9",
      children: [
        {
          name:"💰 记账本\nLedger",color:"#0ea5e9",children:[
            {name:"NL2SQL\nDeepSeek生成SQL",color:"#38b8f0"},
            {name:"SQLite\nmoney_notes.db",color:"#38b8f0"},
            {name:"对话式交互\n识别'我'/自动日期",color:"#38b8f0"},
            {name:"软删除\nUPDATE enabled=0",color:"#38b8f0"},
          ]
        },
        {
          name:"⏰ 日程提醒\nSchedule",color:"#0ea5e9",children:[
            {name:"LLM提取\n{date,time,content,repeat}",color:"#38b8f0"},
            {name:"今日/最近/提示\n三级查询回退",color:"#38b8f0"},
            {name:"编号删除\n正则提取ID",color:"#38b8f0"},
          ]
        },
        {
          name:"🎨 文生图\nT2I",color:"#0ea5e9",children:[
            {name:"文本→图像\nDashScope API",color:"#38b8f0"},
            {name:"人脸旋转\n左转30°/右转30°",color:"#38b8f0"},
            {name:"qwen-image-edit-max\nV2.1升级",color:"#38b8f0"},
          ]
        },
        {
          name:"📊 基金问答\nFund Q&A",color:"#0ea5e9",children:[
            {name:"NL2SQL\n10张表 1.46GB",color:"#38b8f0"},
            {name:"债券/股票/净值\n三大查询类型",color:"#38b8f0"},
            {name:"_format_fund_answer\n模板兜底",color:"#ef4444"},
            {name:"AI润色2048tokens\n自动重试SQL修正",color:"#38b8f0"},
          ]
        },
        {
          name:"📄 招股书问答\nProspectus RAG",color:"#0ea5e9",children:[
            {name:"公司名提取\n后缀匹配+ngram",color:"#38b8f0"},
            {name:"文件匹配\n评分:后缀/ngram/内容",color:"#38b8f0"},
            {name:"段落定位\n精准词优先+数据扫荡",color:"#38b8f0"},
            {name:"三道防线\n数据扫荡|补词|两轮RAG",color:"#ef4444"},
          ]
        },
      ]
    },
    {
      name: "数据层\nDATA",
      color: "#06b6d4",
      children: [
        {name:"SQLite ×4\nmoney/schedule/demo/博金杯",color:"#2dc9e3"},
        {name:"博金杯比赛数据.db\n1.46GB 10张表",color:"#2dc9e3"},
        {name:"招股书TXT\n80份PDF→TXT",color:"#2dc9e3"},
        {name:"外部API\nDeepSeek + DashScope",color:"#2dc9e3"},
        {name:"Demo问答库\ndemo_qa.db 关键词匹配",color:"#2dc9e3"},
      ]
    },
    {
      name: "前端 & 部署\nFRONTEND",
      color: "#f59e0b",
      children: [
        {name:"Flask :5002\nThreaded Server",color:"#f7b84e"},
        {name:"暗色主题UI\nHTML/CSS/JS 原生",color:"#f7b84e"},
        {name:"图片上传/粘贴\nBase64传输",color:"#f7b84e"},
        {name:"API /api/chat\nJSON响应",color:"#f7b84e"},
        {name:"Session管理\n多轮对话记忆",color:"#f7b84e"},
      ]
    },
    {
      name: "优化历程\nHISTORY",
      color: "#8b5cf6",
      children: [
        {name:"V1.0 单工具独立运行",color:"#a88cf7"},
        {name:"V2.0 五合一编排\n暗色UI·多轮对话",color:"#a88cf7"},
        {name:"V2.1 文生图修复\nqwen-image-edit-max",color:"#a88cf7"},
        {name:"V2.2 深度修复\n推理模型token+三道防线",color:"#ef4444"},
      ]
    },
  ]
};

const width = window.innerWidth;
const height = window.innerHeight;

// 创建SVG元素（独立变量，不与g混淆）
const svgEl = d3.select("#mindmap")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

// 缩放行为（保存引用，供按钮调用）
const zoomBehavior = d3.zoom()
  .scaleExtent([0.3, 3])
  .on("zoom", (e) => mainG.attr("transform", e.transform));

svgEl.call(zoomBehavior);

// 主绘图组
const mainG = svgEl.append("g");

// 相比标准树布局，使用更紧凑的力导向布局
const root = d3.hierarchy(data);
const treeLayout = d3.tree().size([2 * Math.PI, 420]).separation((a,b) => (a.parent===b.parent?1:1.3)/a.depth);
treeLayout(root);

// 径向投影
const links = root.links();
const nodes = root.descendants();

// 画连线
mainG.append("g")
  .selectAll("path")
  .data(links)
  .join("path")
  .attr("d", d3.linkRadial()
    .angle(d => d.x)
    .radius(d => d.y))
  .attr("fill", "none")
  .attr("stroke", d => d.source.data.color || "#cbd5e1")
  .attr("stroke-width", d => d.source.depth === 0 ? 3 : d.source.depth === 1 ? 2.5 : 1.5)
  .attr("stroke-opacity", 0.65);

// 画节点
const node = mainG.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("transform", d => `rotate(${d.x*180/Math.PI-90}) translate(${d.y},0)`);

// 节点圆
node.append("circle")
  .attr("r", d => d.depth === 0 ? 42 : d.depth === 1 ? 28 : d.depth === 2 ? 18 : 10)
  .attr("fill", d => d.data.color || "#cbd5e1")
  .attr("stroke", "#fff")
  .attr("stroke-width", d => d.depth <= 1 ? 3 : 2)
  .style("filter", "drop-shadow(0 2px 4px rgba(0,0,0,.15))")
  .on("mouseenter", function(e,d){
    d3.select(this).transition().duration(200).attr("r", (d.depth===0?52:d.depth===1?36:d.depth===2?24:14));
    d3.select("#tooltip").style("opacity",1).text(d.data.name.replace(/\n/g," "));
  })
  .on("mousemove", e => {
    d3.select("#tooltip").style("left",(e.pageX+12)+"px").style("top",(e.pageY-30)+"px");
  })
  .on("mouseleave", function(e,d){
    d3.select(this).transition().duration(200).attr("r", (d.depth===0?42:d.depth===1?28:d.depth===2?18:10));
    d3.select("#tooltip").style("opacity",0);
  });

// 节点文字
node.filter(d => d.depth <= 2)
  .append("text")
  .attr("dy", "0.31em")
  .attr("text-anchor", "middle")
  .attr("transform", d => `rotate(${d.x>=Math.PI?180:0})`)
  .attr("font-size", d => d.depth===0?13:d.depth===1?9:7.5)
  .attr("font-weight", d => d.depth<=1?700:600)
  .attr("fill", d => d.depth===0?"#fff":d.depth===1?"#fff":"#fff")
  .style("pointer-events","none")
  .each(function(d){
    const lines = d.data.name.split("\n");
    const el = d3.select(this);
    lines.forEach((l,i) => {
      el.append("tspan")
        .attr("x", 0)
        .attr("dy", i===0?-(lines.length-1)*0.6+"em":"1.2em")
        .text(l);
    });
  });

function zoomIn(){ svgEl.transition().duration(300).call(zoomBehavior.scaleBy, 1.3); }
function zoomOut(){ svgEl.transition().duration(300).call(zoomBehavior.scaleBy, 0.7); }
function resetView(){ svgEl.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity); }

// 响应式
window.addEventListener("resize", () => {
  svgEl.attr("width", window.innerWidth).attr("height", window.innerHeight);
});
</script>
</body>
</html>
