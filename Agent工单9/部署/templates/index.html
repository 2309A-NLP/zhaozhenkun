<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 数字人智能助手</title>
<style>
:root{--bg:#080c1a;--bg2:#0f1535;--card:#181f45;--border:#283060;--a1:#f59e0b;--a2:#ef4444;--a3:#8b5cf6;--a4:#06b6d4;--tx1:#eef0ff;--tx2:#8899b9;--tx3:#556888;--grn:#10b981}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx1);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* === Header === */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border);background:rgba(15,21,53,.95);z-index:10;flex-shrink:0;min-height:52px}
.header .logo{display:flex;align-items:center;gap:10px}
.header .logo .icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-size:16px}
.header .logo h1{font-size:15px;font-weight:600}
.header .status{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--tx2)}
.header .status span{display:flex;align-items:center;gap:4px}
.header .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.header .dot.on{background:var(--grn);box-shadow:0 0 8px rgba(16,185,129,.5)}
.header .dot.off{background:var(--tx3)}

/* === Main: 50/50 Split === */
.main{display:flex;flex:1;overflow:hidden;gap:0;background:var(--border)}
.panel{display:flex;flex-direction:column;overflow:hidden}
.panel-left{flex:1;background:var(--bg2);border-right:1px solid var(--border);min-width:360px}
.panel-right{flex:1;background:var(--bg);min-width:360px;position:relative}

/* ===== LEFT: Chat ===== */
.chat-header{padding:14px 20px 10px;flex-shrink:0;display:flex;align-items:center;gap:8px}
.chat-header .title-dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px rgba(16,185,129,.4)}
.chat-header h2{font-size:14px;font-weight:600}

.chat-msgs{flex:1;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:8px}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

.msg{display:flex;gap:8px;animation:slideUp .3s ease-out;max-width:90%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg .av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.msg.user .av{background:linear-gradient(135deg,var(--a1),var(--a2))}
.msg.ai .av{background:var(--card);border:1px solid var(--border)}
.msg .bub{padding:10px 14px;border-radius:12px;font-size:12.5px;line-height:1.6;word-break:break-word}
.msg.user .bub{background:linear-gradient(135deg,#b45309,#dc2626);color:#fff;border-bottom-right-radius:4px}
.msg.ai .bub{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .tag{font-size:9px;color:var(--a1);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.msg .time{font-size:9px;color:var(--tx3);margin-top:3px}
.msg .msg-img{max-width:180px;max-height:180px;border-radius:8px;margin-top:6px;cursor:pointer;border:2px solid var(--border);transition:transform .2s;display:block}
.msg .msg-img:hover{transform:scale(1.03)}

@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

/* Input Area */
.input-area{padding:10px 20px 14px;border-top:1px solid var(--border);background:rgba(15,21,53,.95);flex-shrink:0}
.quick-btns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:10px}
.quick-btn{padding:5px 12px;border-radius:14px;font-size:10.5px;border:1px solid var(--border);color:var(--tx2);cursor:pointer;background:transparent;transition:all .2s;white-space:nowrap}
.quick-btn:hover{border-color:var(--a1);color:var(--a1);background:rgba(245,158,11,.06)}
.input-row{display:flex;gap:6px;align-items:flex-end}
.input-wrap{flex:1;display:flex;align-items:center;gap:4px;background:var(--card);border-radius:14px;border:1px solid var(--border);padding:3px 3px 3px 12px;transition:border-color .25s}
.input-wrap:focus-within{border-color:var(--a1)}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:var(--tx1);font-size:12.5px;font-family:inherit;padding:8px 0;resize:none;min-height:22px;max-height:90px}
.input-wrap textarea::placeholder{color:var(--tx3);font-size:11px}

/* Image attach button on left side of input */
.img-attach-left{width:34px;height:34px;flex-shrink:0;margin-right:2px}
.img-attach-left.has-img{border-color:var(--a3);background:rgba(139,92,246,.2);color:var(--a3)}

/* Image pill in input */
.img-pill{display:none;align-items:center;gap:3px;padding:3px 8px 3px 3px;background:rgba(139,92,246,.12);border:1px solid var(--a3);border-radius:16px;margin-right:6px;flex-shrink:0;animation:slideUp .2s ease-out}
.img-pill img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.img-pill span{font-size:10px;color:var(--a3);white-space:nowrap}
.img-pill button{width:15px;height:15px;border-radius:50%;background:var(--a2);color:#fff;border:none;cursor:pointer;font-size:9px;line-height:1;flex-shrink:0}

/* Input buttons */
.input-btns{display:flex;gap:5px;flex-shrink:0}
.circle-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:#fff;cursor:pointer;font-size:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.circle-btn:hover{background:var(--border)}
.circle-btn.has-img{border-color:var(--a3);background:rgba(139,92,246,.2);color:var(--a3)}
.circle-btn.recording{background:var(--a2);border-color:var(--a2);animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
.send-btn{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;cursor:pointer;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.send-btn:hover{transform:scale(1.06);box-shadow:0 0 14px rgba(245,158,11,.25)}
.send-btn:disabled{opacity:.35;transform:none;box-shadow:none}

/* ===== RIGHT: Digital Human ===== */
.dh-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

/* Video/Photo Frame */
.dh-frame{position:relative;width:min(420px,90%);aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:#000;border:2px solid var(--border);transition:all .5s;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.dh-frame.no-avatar{border-color:var(--border)}
.dh-frame.has-avatar{border-color:var(--grn);box-shadow:0 8px 40px rgba(16,185,129,.15)}
.dh-frame.speaking{border-color:var(--a1);box-shadow:0 0 50px rgba(245,158,11,.25);animation:speakGlow .6s ease-in-out infinite alternate}
@keyframes speakGlow{from{box-shadow:0 0 30px rgba(245,158,11,.15)}to{box-shadow:0 0 55px rgba(245,158,11,.35)}}

.dh-frame video{width:100%;height:100%;object-fit:cover;display:none}
.dh-frame img{width:100%;height:100%;object-fit:cover;display:none}
.dh-frame .dh-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:1}
.dh-frame .dh-empty .icon{font-size:56px;opacity:.3;margin-bottom:6px}
.dh-frame .dh-empty .text{font-size:12px;color:var(--tx3);text-align:center;line-height:1.7}

/* Speaking indicator */
.dh-speaking-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px;z-index:3}
.dh-frame.speaking .dh-speaking-bar{display:flex}
.dh-speaking-bar .bar-dot{width:5px;height:5px;border-radius:50%;background:var(--grn);animation:bounce .6s infinite ease-in-out}
.dh-speaking-bar .bar-dot:nth-child(2){animation-delay:.15s}.dh-speaking-bar .bar-dot:nth-child(3){animation-delay:.3s}
.dh-speaking-bar span{font-size:10px;color:var(--grn)}

/* Upload area below frame */
.dh-actions{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dh-upload-btn{display:flex;align-items:center;gap:8px;padding:10px 24px;border-radius:25px;border:2px dashed var(--a3);background:rgba(139,92,246,.04);color:var(--a3);cursor:pointer;font-size:13px;font-weight:500;transition:all .25s}
.dh-upload-btn:hover{border-style:solid;background:rgba(139,92,246,.1);transform:translateY(-1px)}
.dh-upload-btn.ready{border-color:var(--grn);border-style:solid;color:var(--grn);background:rgba(16,185,129,.08)}
.dh-hint{font-size:10.5px;color:var(--tx3);text-align:center;line-height:1.5;max-width:300px}

/* Status row */
.dh-status-row{display:flex;gap:20px;margin-top:6px;font-size:10px;color:var(--tx3)}
.dh-status-row span{display:flex;align-items:center;gap:4px}
.dh-status-row .s-dot{width:6px;height:6px;border-radius:50%}

/* Hidden */
.hidden-file{display:none}

/* Responsive */
@media(max-width:768px){
  .main{flex-direction:column}
  .panel-left{flex:1;border-right:none;border-bottom:1px solid var(--border);min-width:0}
  .panel-right{flex:none;height:50%;min-width:0}
  .dh-frame{max-width:240px;aspect-ratio:1}
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">
    <div class="icon">🤖</div>
    <h1>AI 数字人智能助手</h1>
  </div>
  <div class="status">
    <span><span class="dot" id="asrDot" style="background:var(--tx3)"></span> 语音识别</span>
    <span><span class="dot" id="ttsDot" style="background:var(--tx3)"></span> 语音合成</span>
    <span><span class="dot" id="dhDot" style="background:var(--tx3)"></span> 数字人</span>
  </div>
</header>

<!-- Main: Left (Chat) + Right (Digital Human) -->
<div class="main">

  <!-- ===== LEFT: 聊天问答 ===== -->
  <div class="panel panel-left">
    <div class="chat-header">
      <div class="title-dot"></div>
      <h2>💬 智能对话</h2>
    </div>

    <div class="chat-msgs" id="chatMsgs">
      <div style="text-align:center;color:var(--tx3);margin-top:60px">
        <div style="font-size:48px;margin-bottom:12px;opacity:.6">🧠</div>
        <div style="font-size:15px;font-weight:600;color:var(--tx1);margin-bottom:8px">AI 数字人智能助手</div>
        <div style="font-size:11px;line-height:1.8;opacity:.8">
          ① 在<b>右侧</b>上传人物照片作为数字人形象<br>
          ② 在下方输入问题或点击 🎤 语音输入<br>
          ③ AI 会分析你的问题并调用对应工具<br>
          ④ 数字人会用<b>唇形同步视频</b>念出答案 📹
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="quick-btns">
        <button class="quick-btn" onclick="ask('今天买书花了50元，帮我记账')">💰 记账</button>
        <button class="quick-btn" onclick="ask('提醒我明天下午3点开会')">⏰ 日程</button>
        <button class="quick-btn" onclick="ask('生成一张未来城市的赛博朋克夜景图片')">🎨 文生图</button>
        <button class="quick-btn" onclick="ask('景顺长城中短债债券C最新持仓')">📊 基金</button>
        <button class="quick-btn" onclick="ask('湖南长远锂科股份有限公司的发起人有哪些')">📄 招股书</button>
        <button class="quick-btn" onclick="ask('你好，请介绍一下你自己')">👋 闲聊</button>
      </div>
      <div class="input-row">
        <div class="input-wrap">
          <!-- 文生图：上传图片按钮在输入框左边 -->
          <button class="circle-btn img-attach-left" id="imgAttachBtn" onclick="document.getElementById('hiddenImgInput').click()" title="文生图/人脸旋转：上传图片后输入指令发送">🖼️</button>
          <input type="file" id="hiddenImgInput" class="hidden-file" accept="image/*" onchange="onFileImage(event)">
          <span class="img-pill" id="imgPill">
            <img id="imgPillThumb" src="">
            <span>图片就绪</span>
            <button onclick="removeImage()" title="移除">✕</button>
          </span>
          <textarea id="qInput" rows="1" placeholder="输入问题，Enter 发送...&#10;文生图：点左边🖼️上传图片，输入描述后发送" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"></textarea>
        </div>
        <div class="input-btns">
          <button class="circle-btn" id="micBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
          <button class="send-btn" id="sendBtn" onclick="sendText()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== RIGHT: 数字人形象 ===== -->
  <div class="panel panel-right">
    <div class="dh-container">
      <!-- Main frame -->
      <div class="dh-frame no-avatar" id="dhFrame">
        <video id="dhVideo" loop playsinline webkit-playsinline preload="auto"></video>
        <img id="dhPhoto" alt="数字人形象">
        <div class="dh-empty" id="dhEmpty">
          <div class="icon">👤</div>
          <div class="text">上传一张人物照片<br>数字人将在这里<br>用唇形同步念出答案</div>
        </div>
        <div class="dh-speaking-bar" id="dhSpeakingBar">
          <div class="bar-dot"></div><div class="bar-dot"></div><div class="bar-dot"></div>
          <span>正在播报...</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="dh-actions">
        <label class="dh-upload-btn" id="faceUploadLabel" for="facePhotoInput">
          <span id="faceUploadText">🎬 上传数字人照片</span>
          <input type="file" id="facePhotoInput" class="hidden-file" accept="image/*" onchange="onFacePhoto(event)">
        </label>
        <div class="dh-hint">
          上传含清晰人脸的正面照片<br>
          数字人会用唇形同步念出AI的回复<br>
          引擎: SadTalker (3DMM面部渲染)
        </div>
        <div class="dh-status-row">
          <span><span class="s-dot" id="asrSDot" style="background:var(--tx3)"></span> ASR</span>
          <span><span class="s-dot" id="ttsSDot" style="background:var(--tx3)"></span> TTS</span>
          <span><span class="s-dot" id="dhSDot" style="background:var(--tx3)"></span> DH</span>
          <span id="slaLabel" style="color:var(--tx3)">SLA</span>
        </div>
      </div>
    </div>

    <!-- Hidden audio -->
    <audio id="ttsAudio" style="display:none" preload="auto"></audio>
  </div>
</div>

<script>
// ==================== State ====================
var busy = false;
var sid = 's' + Date.now();
var attachedImageB64 = null;      // image attached to main input
var lastGenImageB64 = null;      // last generated image for reference
var currentAvatarB64 = null;      // current DH avatar preview
var audioUnlocked = false;       // ★ browser autoplay unlock flag

var chatMsgs = document.getElementById('chatMsgs');
var qInput = document.getElementById('qInput');
var sendBtn = document.getElementById('sendBtn');

// Auto-resize textarea
qInput.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 90) + 'px';
});

// ==================== Init ====================
setTimeout(checkHealth, 800);
setTimeout(restoreAvatar, 1000);
// ★ 唇形同步修复: 在首次用户交互时解锁浏览器音频自动播放
unlockAudioOnFirstInteraction();

// ★ 唇形同步修复: 在首次用户交互时解锁浏览器 AudioContext
// 问题根因: fetch().then() 回调是异步的, 不在用户手势上下文中,
// 浏览器会阻止 video.play() 的音频播放, 导致数字人嘴唇在动但没有声音。
// 修复: 在用户首次点击/触摸时创建 AudioContext 并 resume(),
// 将其标记为 "user-gesture-approved", 后续所有音频播放均被允许。
function unlockAudioOnFirstInteraction(){
  var events = ['click','touchstart','keydown'];
  function unlock(){
    audioUnlocked = true;
    // 方案1: Web Audio API — 最可靠
    try{
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(AudioCtx){
        var ctx = new AudioCtx();
        // 播放一个极短的无声振荡器, 激活 AudioContext
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        gain.gain.value = 0.001;  // 几乎无声
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(0);
        osc.stop(0.001);
        if(ctx.state === 'suspended'){ ctx.resume(); }
        console.log('AudioContext解锁成功 state=' + ctx.state);
      }
    }catch(e){ console.log('AudioContext解锁: ' + e.message); }
    // 方案2: 同时用 <audio> 元素解锁 HTML5 播放路径
    try{
      var a = document.getElementById('ttsAudio');
      if(a){
        var p = a.play();
        if(p){ p.then(function(){ a.pause(); a.currentTime = 0; }).catch(function(){}); }
      }
    }catch(e){}
    // 移除所有监听器
    for(var i = 0; i < events.length; i++){
      document.body.removeEventListener(events[i], unlock);
    }
  }
  for(var i = 0; i < events.length; i++){
    document.body.addEventListener(events[i], unlock, {once: false});
  }
}

function checkHealth(){
  fetch('/api/health').then(r => r.json()).then(d => {
    // ASR
    if(d.asr && d.asr.loaded){
      setDot('asrDot', true); setDot('asrSDot', true);
    }
    // TTS
    if(d.tts && d.tts.available){
      setDot('ttsDot', true); setDot('ttsSDot', true);
    }
    // DH
    if(d.digital_human && d.digital_human.loaded){
      setDot('dhDot', true); setDot('dhSDot', true);
    }
  }).catch(() => {});
}

function setDot(id, on){
  var el = document.getElementById(id);
  if(!el) return;
  if(on){ el.classList.add('on'); el.classList.remove('off'); }
  else{ el.classList.add('off'); el.classList.remove('on'); }
}

function restoreAvatar(){
  // Try to load last used avatar
  fetch('/api/avatar/current').then(r => r.json()).then(d => {
    if(d.has_avatar && d.avatar_url){
      showAvatarPhoto(d.avatar_url);
      document.getElementById('faceUploadLabel').classList.add('ready');
      document.getElementById('faceUploadText').textContent = '📷 人物照片已就绪 ✓ (点击更换)';
    }
  }).catch(() => {});
}

// ==================== Face Photo ====================
function onFacePhoto(e){
  var f = e.target.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    currentAvatarB64 = ev.target.result;
    showAvatarPhoto(currentAvatarB64);
  };
  reader.readAsDataURL(f);

  var fd = new FormData();
  fd.append('avatar', f); fd.append('name', 'my_avatar');
  var label = document.getElementById('faceUploadLabel');
  var labelText = document.getElementById('faceUploadText');
  labelText.textContent = '⏳ 激活中...';
  fetch('/api/avatar/upload', {method:'POST', body:fd}).then(r => r.json()).then(d => {
    if(d.status === 'ok'){
      label.classList.add('ready');
      labelText.textContent = '📷 人物照片已就绪 ✓ (点击更换)';
    } else {
      labelText.textContent = '⚠️ 上传失败，重试';
    }
  }).catch(() => { labelText.textContent = '⚠️ 网络错误，重试'; });
}

function showAvatarPhoto(src){
  var photo = document.getElementById('dhPhoto');
  var empty = document.getElementById('dhEmpty');
  var frame = document.getElementById('dhFrame');
  photo.src = src;
  photo.style.display = 'block';
  empty.style.display = 'none';
  frame.classList.remove('no-avatar');
  frame.classList.add('has-avatar');
  localStorage.setItem('dh_avatar_preview', src);
}

// ==================== Text Chat ====================
function ask(q){ qInput.value = q; sendText(); }

function sendText(){
  if(busy) return;
  var text = qInput.value.trim();
  if(!text && !attachedImageB64) return;
  if(!text && attachedImageB64) text = '请处理这张图片';

  // Show user message
  addMsg('user', text, attachedImageB64);
  qInput.value = ''; qInput.style.height = 'auto';

  var loadingId = addLoading();
  busy = true; sendBtn.disabled = true;

  var body = {question: text, session: sid, tts: true};
  if(attachedImageB64){ body.image = attachedImageB64; }

  // Clear attached image
  var hadImage = !!attachedImageB64;
  removeImage();

  fetch('/api/chat?_=' + Date.now(), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(r => r.json()).then(d => {
    removeLoading(loadingId);
    // ★ 防兜底: 确保 answer 不为空（防止"没有字"）
    var answerText = d.answer || d.result || '';
    if(!answerText.trim() && d.error){ answerText = '⚠️ ' + d.error; }
    if(!answerText.trim()){ answerText = '⚠️ 服务返回了空响应，请重试。'; }
    var content = (d.tool ? '【' + d.tool + '】\n' : '') + answerText;
    addMsg('ai', content, d.elapsed, d.tool, d.images);
    // ★ 唇形同步修复: MP4 + 独立音频双保险
    // 浏览器可能阻止视频的音频自动播放 (fetch回调不在用户手势上下文中)
    // 有视频时: 播放视频, 音频作为备选 (视频加载失败或静音时自动切换)
    if(d.video_url){
      playDHVideo(d.video_url, d.audio);
    } else if(d.audio){
      playAudio(d.audio);
    }
    // Update SLA
    updateSLA(d);
    // Store last generated image
    if(d.images && d.images.length > 0){
      lastGenImageB64 = 'data:image/png;base64,' + d.images[0];
    }
    busy = false; sendBtn.disabled = false;
    qInput.focus();
  }).catch(e => {
    removeLoading(loadingId);
    addMsg('ai', '⚠️ 请求超时，请重试。如持续出现，请检查服务是否正常运行。');
    busy = false; sendBtn.disabled = false;
  });
}

// ==================== Voice Chat ====================
var mediaRecorder = null, audioChunks = [], isRecording = false, audioStream = null;

async function toggleVoice(){
  if(isRecording){ stopVoice(); return; }
  await startVoice();
}

async function startVoice(){
  if(!navigator.mediaDevices){ alert('浏览器不支持麦克风'); return; }
  try{
    var stream = await navigator.mediaDevices.getUserMedia({
      audio: {sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true}
    });
    audioStream = stream;
    var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    mediaRecorder = new MediaRecorder(stream, {mimeType: mime});
    audioChunks = [];
    mediaRecorder.ondataavailable = function(e){ if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = processVoice;
    mediaRecorder.start(250);
    isRecording = true;
    var mb = document.getElementById('micBtn');
    mb.classList.add('recording'); mb.textContent = '⏹';
    addSystemMsg('🎤 正在聆听，说完后点击 ⏹ 停止...');
  } catch(e){ alert('麦克风权限被拒绝: ' + e.message); }
}

function stopVoice(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  var mb = document.getElementById('micBtn');
  mb.classList.remove('recording'); mb.textContent = '🎤';
}

async function processVoice(){
  if(audioStream){ audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
  if(audioChunks.length === 0) return;
  var blob = new Blob(audioChunks, {type: 'audio/webm'});
  addSystemMsg('🔍 语音识别中... (' + (blob.size/1024).toFixed(1) + 'KB)');

  var loadingId = addLoading();
  busy = true; sendBtn.disabled = true;
  var fd = new FormData();
  fd.append('audio', blob, 'recording.webm');
  fd.append('session', sid);

  try{
    var r = await fetch('/api/voice/chat', {method:'POST', body:fd});
    var d = await r.json();
    removeLoading(loadingId);
    if(d.error){ addMsg('ai', '⚠️ ' + d.error); busy = false; sendBtn.disabled = false; return; }
    if(d.query) addMsg('user', '🎤 ' + d.query);
    // ★ 防兜底: 确保 answer 不为空
    var answerText = d.answer || d.result || '';
    if(!answerText.trim() && d.error){ answerText = '⚠️ ' + d.error; }
    if(!answerText.trim()){ answerText = '⚠️ 语音处理返回空响应，请重试。'; }
    var content = (d.tool ? '【' + d.tool + '】\n' : '') + answerText;
    addMsg('ai', content, d.elapsed, d.tool, d.images);
    // ★ 唇形同步修复: MP4 + 独立音频双保险
    if(d.video_url){
      playDHVideo(d.video_url, d.audio);
    } else if(d.audio){
      playAudio(d.audio);
    }
    if(d.images && d.images.length > 0) lastGenImageB64 = 'data:image/png;base64,' + d.images[0];
    updateSLA(d);
  } catch(e){
    removeLoading(loadingId);
    addMsg('ai', '⚠️ 语音处理失败');
  }
  busy = false; sendBtn.disabled = false;
}

// ==================== Digital Human Video ====================
// ★★★ 唇形同步深度修复 ★★★
// 根因: fetch().then() 回调中调用 video.play() 不在用户手势上下文中,
// 浏览器会阻止视频的音频轨道, 导致"嘴唇动但没声音"。
// 修复策略:
//   1. 页面加载时通过用户首次交互解锁 AudioContext (unlockAudioOnFirstInteraction)
//   2. 优先用 MP4 视频 (含音轨) 播放
//   3. 视频自动播放被阻止时: 静音播放视频 + 独立播放 base64 WAV 音频
//   4. 视频完全加载失败时: 降级到纯音频播放
function playDHVideo(url, audioB64){
  var frame = document.getElementById('dhFrame');
  var video = document.getElementById('dhVideo');
  var photo = document.getElementById('dhPhoto');
  var empty = document.getElementById('dhEmpty');
  var bar = document.getElementById('dhSpeakingBar');

  // 保存当前照片用于播放完毕后恢复
  var photoSrc = photo.src;
  photo.style.display = 'none';
  empty.style.display = 'none';

  // 先停止任何正在播放的音频
  var a = document.getElementById('ttsAudio');
  try{ a.pause(); a.currentTime = 0; }catch(e){}

  // ★ 关键修复: 先加载视频, 确认可播放后再显示
  video.style.display = 'none';
  video.src = url;
  video.loop = false;
  video.muted = false;          // ★ 不静音 — 数字人必须出声
  video.playsInline = true;     // iOS Safari 内联播放
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.preload = 'auto';

  frame.classList.add('has-avatar');
  frame.classList.remove('no-avatar');

  var videoAudioPlayed = false;  // 标记视频音轨是否已成功播放

  // ★ 使用 oncanplay 而不是 onloadeddata: oncanplay 确保音频流也已就绪
  video.oncanplay = function(){
    video.style.display = 'block';
    frame.classList.add('speaking');
    if(bar) bar.style.display = 'flex';

    var playPromise = video.play();
    if(playPromise !== undefined){
      playPromise.then(function(){
        console.log('数字人视频播放成功 (含音轨)');
        videoAudioPlayed = true;
      }).catch(function(e){
        // ★ 自动播放被浏览器阻止 — 这是"嘴唇动但没声音"的根因
        console.warn('视频自动播放被阻止: ' + e.name + ', 启用双通道方案...');
        // 静音播放视频 (嘴唇动)
        video.muted = true;
        video.play().then(function(){
          console.log('视频以静音模式运行, 通过独立音频通道发声');
        }).catch(function(e2){
          console.error('静音播放也失败: ' + e2.message);
        });
        // ★ 同时用独立 <audio> 元素播放音频 (与视频并行的音频通道)
        if(audioB64){
          console.log('启动独立音频通道 (与视频并行)');
          a.src = 'data:audio/wav;base64,' + audioB64;
          a.load();
          a.play().then(function(){
            console.log('独立音频通道播放成功 - 嘴唇+声音同步');
          }).catch(function(e3){
            console.error('独立音频也播放失败: ' + e3.message);
            addSystemMsg('🔇 浏览器阻止了音频播放, 请点击页面后重试');
          });
        }
      });
    }
  };

  // ★ 备用: onloadeddata 兜底 (某些浏览器中 oncanplay 可能不触发)
  video.onloadeddata = function(){
    if(video.style.display === 'none' && !videoAudioPlayed){
      video.style.display = 'block';
      frame.classList.add('speaking');
      if(bar) bar.style.display = 'flex';
      video.play().catch(function(e){
        console.error('onloadeddata播放失败: ' + e.message);
        // 降级到纯音频
        if(audioB64 && !videoAudioPlayed){
          playAudio(audioB64);
        }
      });
    }
  };

  video.onended = function(){
    video.style.display = 'none';
    frame.classList.remove('speaking');
    if(bar) bar.style.display = 'none';
    // 停止独立音频 (如果还在播放)
    try{ a.pause(); a.currentTime = 0; }catch(e){}
    // 恢复照片
    if(photoSrc && photoSrc !== window.location.href && photoSrc.indexOf('data:') === 0){
      photo.src = photoSrc; photo.style.display = 'block';
    } else {
      empty.style.display = 'flex';
      frame.classList.remove('has-avatar');
      frame.classList.add('no-avatar');
    }
  };

  video.onerror = function(e){
    console.error('视频加载失败: ' + (video.error ? video.error.message : 'unknown'));
    video.style.display = 'none';
    frame.classList.remove('speaking');
    if(bar) bar.style.display = 'none';
    // 降级: 播放独立音频 + 恢复照片
    if(audioB64){
      console.log('视频加载失败, 降级到纯音频模式');
      playAudio(audioB64);
    }
    if(photoSrc && photoSrc !== window.location.href && photoSrc.indexOf('data:') === 0){
      photo.src = photoSrc; photo.style.display = 'block';
    } else {
      empty.style.display = 'flex';
      frame.classList.remove('has-avatar');
      frame.classList.add('no-avatar');
    }
    addSystemMsg('⚠️ 视频加载失败, 已切换到音频模式');
  };
}

// ==================== TTS Audio (Fallback) ====================
function playAudio(b64){
  var a = document.getElementById('ttsAudio');
  a.src = 'data:audio/wav;base64,' + b64;
  a.load();
  var p = a.play();
  if(p){
    p.catch(function(e){
      console.error('Audio播放失败: ' + e.name + ' — ' + e.message);
      // 不静默失败, 提示用户
      addSystemMsg('🔇 音频播放被阻止，请点击页面后重试');
    });
  }
}

// ==================== SLA ====================
function updateSLA(d){
  var el = document.getElementById('slaLabel');
  if(d.sla_ok !== undefined){
    el.textContent = d.sla_ok ? 'SLA ✓' : 'SLA ✗';
    el.style.color = d.sla_ok ? 'var(--grn)' : 'var(--a2)';
  }
}

// ==================== Image Attach (main input) ====================
function attachImage(b64){
  attachedImageB64 = b64;
  document.getElementById('imgPillThumb').src = b64;
  document.getElementById('imgPill').style.display = 'flex';
  document.getElementById('imgAttachBtn').classList.add('has-img');
  addSystemMsg('🖼️ 图片已附加，输入指令后发送（如"把人脸向左转"）');
}

function onFileImage(e){
  var f = e.target.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){ attachImage(ev.target.result); };
  reader.readAsDataURL(f);
}

function removeImage(){
  attachedImageB64 = null;
  document.getElementById('imgPill').style.display = 'none';
  document.getElementById('imgAttachBtn').classList.remove('has-img');
}

// ==================== Global Ctrl+V Paste ====================
document.addEventListener('paste', function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(var i = 0; i < items.length; i++){
    if(items[i].type.indexOf('image') !== -1){
      e.preventDefault();
      var blob = items[i].getAsFile();
      var reader = new FileReader();
      reader.onload = function(ev){
        attachImage(ev.target.result);
      };
      reader.readAsDataURL(blob);
      return;
    }
  }
});

// ==================== Chat Messages ====================
function addMsg(role, text, elapsed, tool, images){
  // Remove intro placeholder
  var intro = chatMsgs.querySelector('div[style*="text-align:center"]');
  if(intro && intro.style.textAlign === 'center') intro.remove();

  // ★ 防兜底: 确保 text 始终有可见内容（防止"没有字"问题）
  // 处理 undefined / null / 空字符串 / 纯空白 / 数字 0 / NaN 等边界情况
  if(text === undefined || text === null || text === '' || (typeof text === 'string' && !text.trim()) || (typeof text === 'number' && isNaN(text))){
    text = '⚠️ 收到空响应，请重试。如持续出现，请查看 agent.log 日志排查。';
  }
  if(typeof text !== 'string'){ text = String(text); }

  var d = document.createElement('div');
  d.className = 'msg ' + role;

  var html = '<div class="av">' + (role === 'user' ? '👤' : '🤖') + '</div>';
  html += '<div><div class="bub">';
  if(role === 'ai' && tool) html += '<div class="tag">🔧 ' + tool + '</div>';
  html += escapeHtml(text).replace(/\n/g, '<br>');

  // Attached image in user message
  if(role === 'user' && images){
    html += '<br><img class="msg-img" src="' + images + '" onclick="window.open(this.src)" title="点击查看大图">';
  }
  // Generated images in AI message
  if(role === 'ai' && images && images.length > 0){
    for(var i = 0; i < images.length; i++){
      html += '<br><img class="msg-img" src="data:image/png;base64,' + images[i] + '" onclick="window.open(this.src)" title="点击查看大图">';
    }
  }
  html += '</div><div class="time">' + formatTime() + (elapsed !== undefined ? ' · ' + elapsed + 's' : '') + '</div></div>';

  d.innerHTML = html;
  chatMsgs.appendChild(d);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function addLoading(){
  var d = document.createElement('div');
  d.className = 'msg ai';
  d.id = 'load-' + Date.now();
  d.innerHTML = '<div class="av">🤖</div><div><div class="bub"><div class="typing"><span></span><span></span><span></span></div></div></div>';
  chatMsgs.appendChild(d);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
  return d.id;
}

function removeLoading(id){
  var e = document.getElementById(id);
  if(e) e.remove();
}

function addSystemMsg(txt){
  var d = document.createElement('div');
  d.style.cssText = 'text-align:center;font-size:10px;color:var(--tx3);padding:4px 0';
  d.textContent = txt;
  chatMsgs.appendChild(d);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function formatTime(){
  return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
}

function escapeHtml(str){
  // ★ 防御性编程: 处理 undefined/null/数字等非字符串类型
  if(str === undefined || str === null) return '';
  if(typeof str !== 'string') str = String(str);
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
