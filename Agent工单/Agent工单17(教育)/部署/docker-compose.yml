# 工单编号：人工智能NLP-Agent数字人项目-17-教育Agent任务工单-教学场景功能分析及智能备课
# 文件：docker-compose.yml - 多服务编排配置（含知识库和缓存服务）
# 创建时间：2025年6月
# 启动方式：docker-compose up -d

version: "3.9"  # Docker Compose文件版本

services:
  # ==================== 智能备课主服务 ====================
  lesson-prep-api:
    build:  # 构建配置
      context: ..  # 构建上下文为项目根目录
      dockerfile: 部署/Dockerfile  # Dockerfile路径
    container_name: edu-lesson-prep-api  # 容器名称
    ports:
      - "8000:8000"  # 端口映射：宿主机:容器
    environment:  # 环境变量配置
      - DEEPSEEK_BASE_URL=https://api.deepseek.com  # DeepSeek API地址
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}  # DeepSeek API密钥
      - DEEPSEEK_MODEL=deepseek-chat  # DeepSeek模型
      - QWEN_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1  # Qwen API地址
      - QWEN_API_KEY=${QWEN_API_KEY:-}  # Qwen API密钥
      - QWEN_MODEL=qwen-vl-plus  # Qwen多模态模型
      - DEBUG=false  # 关闭调试模式
      - LOG_LEVEL=INFO  # 日志级别
      - DATABASE_URL=sqlite:///./data/lesson_prep.db  # 数据库路径
    volumes:  # 数据卷挂载
      - ../data:/app/data  # 持久化数据目录
      - ../logs:/app/logs  # 持久化日志目录
    restart: unless-stopped  # 重启策略：除非手动停止
    networks:
      - edu-agent-network  # 加入教育Agent网络
    healthcheck:  # 健康检查
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s  # 每30秒检查
      timeout: 10s  # 超时10秒
      retries: 3  # 重试3次

  # ==================== Redis缓存服务（可选） ====================
  redis:
    image: redis:7-alpine  # 使用Redis 7 Alpine镜像
    container_name: edu-lesson-prep-redis  # 容器名称
    ports:
      - "6379:6379"  # Redis默认端口
    volumes:
      - ./redis_data:/data  # 持久化Redis数据
    command: redis-server --appendonly yes  # 开启AOF持久化
    restart: unless-stopped  # 重启策略
    networks:
      - edu-agent-network  # 加入网络

  # ==================== Nginx反向代理（用于生产环境） ====================
  # 默认不启用，当前仓库未提供nginx.conf与static资源。
  # 如需生产反向代理，请补充对应文件后再启用该服务。
  nginx:
    profiles: ["prod-proxy"]  # 默认不启用，需显式指定 profile
    image: nginx:alpine  # 使用Nginx Alpine镜像
    container_name: edu-lesson-prep-nginx  # 容器名称
    ports:
      - "80:80"  # HTTP端口
      - "443:443"  # HTTPS端口
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Nginx配置（只读）
      - ./static:/usr/share/nginx/html:ro  # 静态文件
    depends_on:
      - lesson-prep-api  # 依赖API服务
    restart: unless-stopped  # 重启策略
    networks:
      - edu-agent-network  # 加入网络

networks:
  edu-agent-network:  # 自定义网络
    driver: bridge  # 桥接网络模式
    name: edu-agent-network  # 网络名称

volumes:
  data:  # 数据卷
    driver: local  # 本地存储
  logs:  # 日志卷
    driver: local  # 本地存储
