# ============================================================
# deploy/docker-compose.yml - Neo4j + Medical Agent 编排
# 一键启动: docker compose -f deploy/docker-compose.yml up -d
# 工单编号: 人工智能NLP-Agent数字人项目-医疗智能体-健康咨询
# ============================================================

services:
  neo4j:
    image: neo4j:5.15.0-community
    container_name: medical-neo4j
    environment:
      - NEO4J_AUTH=neo4j/12345678
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "12345678", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: medical-agent
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=12345678
    ports:
      - "8003:8003"
    depends_on:
      neo4j:
        condition: service_healthy
    command: >
      sh -c "python run.py build && python run.py serve"

volumes:
  neo4j_data:
  neo4j_logs:
