<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏥 湘雅医学院</title>
<style>
:root{--bg:#f0f4f8;--card:#fff;--border:#dde4ed;--primary:#1a73e8;--p2:#0d5bbd;--success:#0a8043;--danger:#d93025;--warn:#e37400;--text:#202124;--t2:#5f6368;--t3:#9aa0a6;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:linear-gradient(135deg,#0d5bbd,#1a73e8);color:#fff;flex-shrink:0;z-index:10}
.header .logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.header .logo .icon{font-size:28px}
.header .info{font-size:11px;opacity:.9;display:flex;gap:16px}
/* Main */
.main{display:flex;flex:1;overflow:hidden}
/* LEFT: Chat 35% */
.panel-left{width:35%;min-width:340px;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--border)}
.chat-title{padding:12px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.msg{display:flex;gap:8px;max-width:90%;animation:slideUp .25s}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg .av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.msg.user .av{background:var(--primary);color:#fff}
.msg.ai .av{background:#e8f0fe;border:2px solid var(--primary)}
.msg .bub{padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user .bub{background:var(--primary);color:#fff;border-bottom-right-radius:3px}
.msg.ai .bub{background:var(--bg);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg .tag{font-size:9px;font-weight:600;color:var(--warn);margin-bottom:3px}
@keyframes slideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-input{padding:8px 12px 12px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input .row{display:flex;gap:6px}
.chat-input textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;outline:none;font-size:12px;font-family:inherit;padding:8px 12px;resize:none;min-height:38px;max-height:80px}
.chat-input textarea:focus{border-color:var(--primary)}
.chat-input button{padding:8px 16px;border-radius:10px;border:none;background:var(--primary);color:#fff;cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0}
.chat-input button:disabled{opacity:.4}
.quick-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.qbtn{padding:4px 10px;border-radius:12px;font-size:10px;border:1px solid var(--border);color:var(--t2);cursor:pointer;background:var(--card);white-space:nowrap}
.qbtn:hover{border-color:var(--primary);color:var(--primary)}
/* RIGHT: Wizard */
.panel-right{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:20px 28px}
.steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:20px;flex-shrink:0}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3)}
.step .num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--bg);border:2px solid var(--border)}
.step.active .num{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .num{background:var(--success);border-color:var(--success);color:#fff}
.step.active{color:var(--primary);font-weight:600}
.step.done{color:var(--success)}
.step-line{width:36px;height:2px;background:var(--border);margin:0 8px}
.step-line.done{background:var(--success)}
.wizard-content{flex:1}
.wizard-content h3{font-size:16px;margin-bottom:6px}
.wizard-content .hint{font-size:11px;color:var(--t2);margin-bottom:14px}
/* Dept grid */
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.dept-card{padding:16px;border-radius:12px;border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:center;transition:.2s;box-shadow:var(--shadow)}
.dept-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 20px rgba(26,115,232,.15)}
.dept-card.selected{border-color:var(--primary);background:#e8f0fe}
.dept-card .icon{font-size:32px;margin-bottom:8px}
.dept-card .name{font-size:14px;font-weight:600}
.dept-card .addr{font-size:10px;color:var(--t2);margin-top:4px}
/* Doctor cards */
.doc-list{display:flex;flex-direction:column;gap:10px}
.doc-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.doc-card:hover{border-color:var(--primary);transform:translateX(4px)}
.doc-card.selected{border-color:var(--primary);background:#e8f0fe}
.doc-card .avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#e8f0fe,#d2e3fc);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.doc-card .info{flex:1}
.doc-card .info .doc-name{font-size:14px;font-weight:600}
.doc-card .info .doc-title{font-size:11px;color:var(--t2)}
.doc-card .info .doc-dept{font-size:10px;color:var(--t3)}
.doc-card .slots{text-align:right;flex-shrink:0}
.doc-card .slots .remain{font-size:24px;font-weight:700;color:var(--primary)}
.doc-card .slots .label{font-size:10px;color:var(--t2)}
.doc-card .slots .fee{font-size:11px;color:var(--warn);margin-top:2px}
/* Time selector */
.time-grid{display:flex;gap:10px;flex-wrap:wrap}
.time-btn{padding:12px 24px;border-radius:10px;border:2px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.time-btn:hover{border-color:var(--primary)}
.time-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff}
.time-btn:disabled{opacity:.35;cursor:not-allowed}
.time-btn .date{font-size:10px;font-weight:400;opacity:.8}
/* Confirm */
.confirm-card{padding:24px;border-radius:14px;border:2px solid var(--border);background:var(--card);box-shadow:var(--shadow);max-width:420px}
.confirm-card .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.confirm-card .row:last-child{border:none}
.confirm-card .row .label{color:var(--t2)}
.confirm-card .row .value{font-weight:600}
/* Buttons */
.btn-row{display:flex;gap:10px;margin-top:16px;flex-shrink:0}
.btn{padding:10px 28px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--p2);box-shadow:0 2px 12px rgba(26,115,232,.3)}
.btn-outline{background:var(--card);color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:#e8f0fe}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* Result */
.result-card{text-align:center;padding:30px}
.result-card .icon{font-size:64px;margin-bottom:12px}
.result-card h3{font-size:20px;margin-bottom:8px}
.result-card .detail{font-size:12px;color:var(--t2);line-height:1.8}
/* Typing */
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6)}40%{transform:scale(1)}}
</style>
</head>
<body>

<header class="header">
  <div class="logo"><span class="icon">🏥</span>湘雅医学院</div>
  <div class="info"><span>🤖 deepseek-v4-pro</span><span id="statusDot">🟢 就绪</span></div>
</header>

<div class="main">

  <!-- ===== LEFT: Chat ===== -->
  <div class="panel-left">
    <div class="chat-title">💬 智能对话</div>
    <div class="chat-msgs" id="chatMsgs">
      <div style="text-align:center;color:var(--t3);margin-top:30px;font-size:12px">右侧挂号向导可完成完整挂号流程<br>此处也可用自然语言对话</div>
    </div>
    <div class="chat-input">
      <div class="quick-row">
        <button class="qbtn" onclick="chatAsk('儿科今天下午还有专家号吗')">儿科</button>
        <button class="qbtn" onclick="chatAsk('牙科最近哪天有号')">牙科</button>
        <button class="qbtn" onclick="chatAsk('皮肤科明天上午有号吗')">皮肤科</button>
        <button class="qbtn" onclick="chatAsk('张建国医生下周坐诊时间')">排班</button>
        <button class="qbtn" onclick="chatAsk('取消我上周三的消化内科号')">取消</button>
      </div>
      <div class="row">
        <textarea id="qInput" rows="1" placeholder="输入挂号需求..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"></textarea>
        <button id="sendBtn" onclick="chatSend()">发送</button>
      </div>
    </div>
  </div>

  <!-- ===== RIGHT: Wizard ===== -->
  <div class="panel-right" id="wizard">
    <div class="steps">
      <div class="step active" id="step1"><div class="num">1</div>选择科室</div>
      <div class="step-line" id="line1"></div>
      <div class="step" id="step2"><div class="num">2</div>选择医生</div>
      <div class="step-line" id="line2"></div>
      <div class="step" id="step3"><div class="num">3</div>确认挂号</div>
      <div class="step-line" id="line3"></div>
      <div class="step" id="step4"><div class="num">4</div>挂号结果</div>
    </div>
    <div class="wizard-content" id="wizardContent"></div>
    <div class="btn-row" id="wizardBtns">
      <button class="btn btn-outline" id="btnPrev" onclick="prevStep()" style="display:none">← 上一步</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextStep()" disabled>下一步 →</button>
    </div>
  </div>
</div>

<script>
// ==================== WIZARD STATE ====================
var step=1, selDept=null, selDoctor=null, selSlot=null, wizBusy=false;
// ==================== CHAT STATE ====================
var chatBusy=false, sid='s'+Date.now();
// Init
loadDepts();

// ==================== STEP 1: 科室 ====================
function loadDepts(){
  wizBusy=true; refreshUI();
  setContent('<div style="text-align:center;padding:60px;color:var(--t3)">⏳ 加载科室...</div>');
  fetch('/api/departments').then(function(r){return r.json();}).then(function(d){
    var icons={'内科':'🫀','外科':'🔪','儿科':'👶','妇科':'👩','眼科':'👁','耳鼻喉科':'👂','牙科':'🦷','皮肤科':'✨','消化内科':'🔬'};
    var h='<h3>🏥 请选择就诊科室</h3><div class="hint">点击科室卡片查看可挂号医生</div><div class="dept-grid" id="deptGrid">';
    d.departments.forEach(function(dp){
      var sel=selDept&&selDept.id===dp.dep_ID?' selected':'';
      h+='<div class="dept-card'+sel+'" data-dep-id="'+dp.dep_ID+'" data-dep-name="'+dp.dep_Name+'">';
      h+='<div class="icon">'+(icons[dp.dep_Name]||'🏥')+'</div><div class="name">'+dp.dep_Name+'</div>';
      h+='<div class="addr">'+(dp.dep_Address||'')+'</div></div>';
    });
    setContent(h+'</div>');
    // Event delegation on parent container
    document.getElementById('deptGrid').onclick=function(e){
      var card=e.target.closest('.dept-card'); if(!card)return;
      var id=parseInt(card.getAttribute('data-dep-id'));
      var name=card.getAttribute('data-dep-name');
      selDept={id:id,name:name}; selDoctor=null; selSlot=null;
      var all=document.querySelectorAll('.dept-card');
      for(var i=0;i<all.length;i++) all[i].classList.remove('selected');
      card.classList.add('selected');
      refreshUI();
    };
    wizBusy=false; refreshUI();
  }).catch(function(e){setContent('加载失败: '+e);wizBusy=false;refreshUI();});
}

// ==================== STEP 2: 医生 ====================
function loadDoctors(){
  if(!selDept)return;
  wizBusy=true; refreshUI();
  setContent('<div style="text-align:center;padding:60px;color:var(--t3)">⏳ 加载'+selDept.name+'医生...</div>');
  fetch('/api/doctors?dep_id='+selDept.id).then(function(r){return r.json();}).then(function(d){
    var h='<h3>👨‍⚕️ '+selDept.name+' — 可挂号医生</h3><div class="hint">点击选择医生</div><div class="doc-list" id="docList">';
    if(!d.doctors.length) h+='<div style="text-align:center;padding:40px;color:var(--t3)">暂无可挂号医生</div>';
    d.doctors.forEach(function(doc){
      var rem=0,minFee=999;
      doc.slots.forEach(function(s){rem+=s.sch_Remain;minFee=Math.min(minFee,s.sch_Fee);});
      var sel=selDoctor&&selDoctor.id===doc.d_ID?' selected':'';
      h+='<div class="doc-card'+sel+'" data-doc-id="'+doc.d_ID+'" data-doc-name="'+doc.d_Name+'" data-doc-title="'+doc.d_Profession+'" data-doc-dept="'+doc.dep_Name+'" data-doc-slots=\''+JSON.stringify(doc.slots)+'\'>';
      h+='<div class="avatar">👨‍⚕️</div><div class="info"><div class="doc-name">'+doc.d_Name+'</div>';
      h+='<div class="doc-title">'+doc.d_Profession+(doc.d_Profession.indexOf('主任')>=0?' 🔥':'')+'</div>';
      h+='<div class="doc-dept">'+doc.dep_Name+'</div></div>';
      h+='<div class="slots"><div class="remain">'+rem+'</div><div class="label">剩余号源</div><div class="fee">¥'+minFee+'起</div></div></div>';
    });
    setContent(h+'</div>');
    document.getElementById('docList').onclick=function(e){
      var card=e.target.closest('.doc-card'); if(!card)return;
      var id=parseInt(card.getAttribute('data-doc-id'));
      var name=card.getAttribute('data-doc-name');
      var title=card.getAttribute('data-doc-title');
      var dept=card.getAttribute('data-doc-dept');
      var slots=JSON.parse(card.getAttribute('data-doc-slots'));
      selDoctor={id:id,name:name,title:title,dept:dept,slots:slots}; selSlot=null;
      var all=document.querySelectorAll('.doc-card');
      for(var i=0;i<all.length;i++) all[i].classList.remove('selected');
      card.classList.add('selected');
      refreshUI();
    };
    wizBusy=false; refreshUI();
  }).catch(function(e){setContent('加载失败: '+e);wizBusy=false;refreshUI();});
}

// ==================== STEP 3: 确认 ====================
function showConfirm(){
  if(!selDoctor)return;
  var h='<h3>📋 确认挂号信息</h3><div class="hint">选择时段并确认</div>';
  h+='<div style="margin-bottom:12px;font-weight:600">⏰ 选择时段:</div><div class="time-grid" id="timeGrid">';
  selDoctor.slots.forEach(function(s,i){
    var sel=selSlot&&selSlot.id===s.sch_ID;
    h+='<button class="time-btn'+(sel?' selected':'')+'" data-slot-idx="'+i+'"'+(s.sch_Remain<=0?' disabled':'')+'>';
    h+=s.sch_Period+'<br><span class="date">'+s.sch_Date+'</span><br><span style="font-size:10px">剩余'+s.sch_Remain+'号 | ¥'+s.sch_Fee+'</span></button>';
  });
  h+='</div>';
  h+='<div class="confirm-card" style="margin-top:16px">';
  h+='<div class="row"><span class="label">科室</span><span class="value">'+selDept.name+'</span></div>';
  h+='<div class="row"><span class="label">医生</span><span class="value">'+selDoctor.name+' ('+selDoctor.title+')</span></div>';
  if(selSlot) h+='<div class="row"><span class="label">时间</span><span class="value">'+selSlot.date+' '+selSlot.period+'</span></div>';
  if(selSlot) h+='<div class="row"><span class="label">费用</span><span class="value" style="color:var(--danger)">¥'+selSlot.fee+'</span></div>';
  h+='<div class="row"><span class="label">就诊人</span><span class="value">张三</span></div></div>';
  setContent(h);
  document.getElementById('timeGrid').onclick=function(e){
    var btn=e.target.closest('.time-btn'); if(!btn||btn.disabled)return;
    var idx=parseInt(btn.getAttribute('data-slot-idx'));
    selSlot={id:selDoctor.slots[idx].sch_ID,date:selDoctor.slots[idx].sch_Date,period:selDoctor.slots[idx].sch_Period,fee:selDoctor.slots[idx].sch_Fee};
    showConfirm();
  };
  refreshUI();
}

// ==================== STEP 4: 提交 ====================
function submitReg(){
  if(!selDept||!selDoctor||!selSlot)return;
  wizBusy=true; refreshUI();
  fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:1,dep_name:selDept.name,doctor_name:selDoctor.name,target_date:selSlot.date,period:selSlot.period})
  }).then(function(r){return r.json();}).then(function(d){
    var h='<div class="result-card"><div class="icon">'+(d.success?'✅':'⚠️')+'</div>';
    h+='<h3 style="color:'+(d.success?'var(--success)':'var(--danger)')+'">'+(d.success?'挂号成功！':'挂号失败')+'</h3>';
    h+='<div class="detail">'+d.result.replace(/\n/g,'<br>')+'</div>';
    h+='<button class="btn btn-primary" style="margin-top:16px" onclick="resetWiz()">🔄 再次挂号</button></div>';
    setContent(h); wizBusy=false; refreshUI();
  }).catch(function(e){setContent('网络错误: '+e);wizBusy=false;refreshUI();});
}
function resetWiz(){step=1;selDept=selDoctor=selSlot=null;loadDepts();}

// ==================== UI ====================
function setContent(html){document.getElementById('wizardContent').innerHTML=html;}
function refreshUI(){
  var prev=document.getElementById('btnPrev'), next=document.getElementById('btnNext');
  for(var i=1;i<=4;i++){var el=document.getElementById('step'+i);el.classList.remove('active','done');if(i<step)el.classList.add('done');if(i===step)el.classList.add('active');}
  document.getElementById('line1').classList.toggle('done',step>1);
  document.getElementById('line2').classList.toggle('done',step>2);
  document.getElementById('line3').classList.toggle('done',step>3);
  if(step===4){prev.style.display='none';next.style.display='none';return;}
  prev.style.display=step>1?'inline-block':'none';
  next.style.display='inline-block';
  next.textContent=step===3?'✅ 确认挂号':'下一步 →';
  var hasSel=(step===1&&selDept)||(step===2&&selDoctor)||(step===3&&selSlot);
  next.disabled=wizBusy||!hasSel;
}
function nextStep(){
  if(wizBusy)return;
  if(step===1&&selDept){step=2;loadDoctors();}
  else if(step===2&&selDoctor){step=3;showConfirm();}
  else if(step===3&&selSlot){step=4;submitReg();}
}
function prevStep(){if(wizBusy||step<=1)return;step--;if(step===1)loadDepts();else if(step===2)loadDoctors();else if(step===3)showConfirm();}

// ==================== CHAT ====================
function chatAsk(q){document.getElementById('qInput').value=q;chatSend();}
function chatSend(){
  if(chatBusy)return; var q=document.getElementById('qInput').value.trim(); if(!q)return;
  addChat('user',q); document.getElementById('qInput').value='';
  var lid=addChatLoad(); chatBusy=true; document.getElementById('sendBtn').disabled=true;
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,session:sid})})
  .then(function(r){return r.json();}).then(function(d){rmChatLoad(lid);addChat('ai',d.answer||'完成',d.tool);chatBusy=false;document.getElementById('sendBtn').disabled=false;})
  .catch(function(e){rmChatLoad(lid);addChat('ai','⚠️ 请求失败');chatBusy=false;document.getElementById('sendBtn').disabled=false;});
}
function addChat(role,text,tool){
  var el=document.getElementById('chatMsgs'),intro=el.querySelector('div[style*="text-align:center"]');if(intro)intro.remove();
  var d=document.createElement('div');d.className='msg '+role;
  var h='<div class="av">'+(role==='user'?'👤':'🏥')+'</div><div><div class="bub">';
  if(role==='ai'&&tool)h+='<div class="tag">'+tool+'</div>';
  h+=text.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div></div>';
  d.innerHTML=h;el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function addChatLoad(){var d=document.createElement('div');d.className='msg ai';d.id='cl-'+Date.now();d.innerHTML='<div class="av">🏥</div><div><div class="bub"><div class="typing"><span></span><span></span><span></span></div></div></div>';document.getElementById('chatMsgs').appendChild(d);return d.id;}
function rmChatLoad(id){var e=document.getElementById(id);if(e)e.remove();}
</script>
</body>
</html>
