<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>招股书智能问答 v2</title>
<style>
:root{--bg:#060b14;--bg2:#0d1425;--card:#131c33;--border:#1e2d50;--ac1:#06b6d4;--ac2:#10b981;--tx1:#e8edf5;--tx2:#8899b9;--tx3:#556888}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx1);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(13,20,37,.9);backdrop-filter:blur(20px);z-index:2}
.header .logo{display:flex;align-items:center;gap:10px}
.header .logo .icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--ac1),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:20px}
.header .logo h1{font-size:18px;font-weight:600;letter-spacing:-0.3px}
.header .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.header .status .dot{width:7px;height:7px;border-radius:50%;background:var(--ac2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;z-index:1}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-track{background:transparent}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:14px}
.welcome .w-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--ac1),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 32px rgba(6,182,212,.25)}
.welcome h2{font-size:22px;font-weight:600}
.welcome p{color:var(--tx2);font-size:14px;max-width:450px;line-height:1.6}
.welcome .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.welcome .tags span{padding:7px 15px;border-radius:20px;font-size:12px;background:var(--card);border:1px solid var(--border);color:var(--tx2);cursor:pointer;transition:all .2s}
.welcome .tags span:hover{border-color:var(--ac1);color:var(--ac1)}
.msg{display:flex;gap:10px;animation:slideUp .3s ease-out;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.msg.user .avatar{background:linear-gradient(135deg,var(--ac1),#3b82f6)}
.msg.ai .avatar{background:var(--card);border:1px solid var(--border)}
.msg .bubble{padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.65;word-break:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#0d7377,#0891b2);color:#fff;border-bottom-right-radius:3px}
.msg.ai .bubble{background:var(--card);color:var(--tx1);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg .time{font-size:10px;color:var(--tx3);margin-top:4px;padding:0 4px}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.typing{display:flex;gap:5px;padding:4px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--tx3);animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1);opacity:1}}
.input-area{padding:16px 24px 20px;border-top:1px solid var(--border);background:rgba(13,20,37,.9);backdrop-filter:blur(20px);z-index:2}
.input-wrap{display:flex;gap:10px;background:var(--card);border-radius:16px;border:1px solid var(--border);padding:6px;transition:border-color .25s}
.input-wrap:focus-within{border-color:var(--ac1);box-shadow:0 0 0 3px rgba(6,182,212,.1)}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:var(--tx1);font-size:14px;font-family:inherit;padding:8px 10px;resize:none;min-height:24px;max-height:120px}
.input-wrap textarea::placeholder{color:var(--tx3)}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;cursor:pointer;font-size:18px;flex-shrink:0;transition:all .25s;display:flex;align-items:center;justify-content:center}
.send-btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(6,182,212,.4)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.input-hint{text-align:center;font-size:11px;color:var(--tx3);margin-top:8px}
@media(max-width:640px){.header{padding:10px 16px}.header .logo h1{font-size:15px}.chat{padding:16px}.input-area{padding:12px 16px 16px}.msg{max-width:92%}}
</style>
</head>
<body>

<header class="header">
<div class="logo"><div class="icon">📄</div><h1>招股书智能问答 v2</h1></div>
<div class="status"><span class="dot"></span> DeepSeek RAG</div>
</header>

<div class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="w-icon">🔍</div>
<h2>招股书PDF数据智能问答</h2>
<p>基于80份招股说明书，输入问题获取AI答案</p>
<div class="tags">
<span onclick="ask('湖南长远锂科股份有限公司变更设立时作为发起人的法人有哪些？')">🏢 发起人</span>
<span onclick="ask('云南沃森生物技术股份有限公司负责产品研发的是什么部门？')">🔬 研发部门</span>
<span onclick="ask('报告期内武汉兴图新科电子股份有限公司来自军用领域的收入分别是多少')">💰 军用收入</span>
</div>
</div>
</div>

<div class="input-area">
<div class="input-wrap">
<textarea id="qInput" rows="1" placeholder="输入问题，例如：报告期内武汉兴图新科电子股份有限公司来自军用领域的收入分别是多少"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
<button class="send-btn" id="sendBtn" onclick="send()">➤</button>
</div>
<div class="input-hint">Enter发送 · Shift+Enter换行 · 80份招股书</div>
</div>

<script>
var chat=document.getElementById('chat'),input=document.getElementById('qInput'),
    btn=document.getElementById('sendBtn'),welcome=document.getElementById('welcome'),busy=false;
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
input.focus();
function ask(q){input.value=q;send()}
async function send(){
    if(busy)return;var q=input.value.trim();if(!q)return;
    if(welcome)welcome.style.display='none';
    addMsg('user',q);input.value='';input.style.height='auto';
    var lid=addLoading();busy=true;btn.disabled=true;
    try{
        var r=await fetch('/api/chat?_='+Date.now(),{method:'POST',
            headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},
            body:JSON.stringify({question:q})});
        var d=await r.json();
        removeLoading(lid);
        addMsg('ai',d.error?'⚠️ '+d.error:d.answer,d.elapsed);
    }catch(e){removeLoading(lid);addMsg('ai','⚠️ 连接失败: '+e.message)}
    busy=false;btn.disabled=false;input.focus();
}
function addMsg(role,text,elapsed){
    var d=document.createElement('div');d.className='msg '+role;
    var a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'👤':'🤖';
    var b=document.createElement('div');b.className='bubble';b.textContent=text;
    var t=document.createElement('div');t.className='time';
    var n=new Date();t.textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+(elapsed!==undefined?' · '+elapsed+'s':'');
    var body=document.createElement('div');body.appendChild(b);body.appendChild(t);
    d.appendChild(a);d.appendChild(body);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function addLoading(){
    var d=document.createElement('div');d.className='msg ai';d.id='load-'+Date.now();
    var a=document.createElement('div');a.className='avatar';a.textContent='🤖';
    var b=document.createElement('div');b.className='bubble';
    b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
    var body=document.createElement('div');body.appendChild(b);
    d.appendChild(a);d.appendChild(body);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
    return d.id;
}
function removeLoading(id){var e=document.getElementById(id);if(e)e.remove()}
</script>
</body>
</html>
