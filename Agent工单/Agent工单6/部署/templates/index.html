<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI Agent 智能体</title>
<style>
:root{--bg:#060712;--bg2:#0d1025;--card:#151833;--border:#242850;--a1:#f59e0b;--a2:#ef4444;--a3:#8b5cf6;--a4:#06b6d4;--tx1:#eef0ff;--tx2:#8899b9;--tx3:#556888}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx1);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.glow{position:fixed;border-radius:50%;filter:blur(120px);opacity:.08;pointer-events:none;z-index:0}
.g1{width:500px;height:500px;background:var(--a1);top:-200px;left:-150px}
.g2{width:400px;height:400px;background:var(--a3);bottom:-150px;right:-100px}
.g3{width:300px;height:300px;background:var(--a4);top:40%;left:50%;transform:translate(-50%,-50%)}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(13,16,37,.9);backdrop-filter:blur(20px);z-index:2}
.header .logo{display:flex;align-items:center;gap:10px}
.header .logo .icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-size:20px}
.header .logo h1{font-size:18px;font-weight:600}
.header .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.header .status .dot{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;z-index:1}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-track{background:transparent}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:14px}
.welcome .w-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 32px rgba(245,158,11,.2)}
.welcome h2{font-size:22px;font-weight:600}
.welcome p{color:var(--tx2);font-size:14px;max-width:500px;line-height:1.6}
.welcome .tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.welcome .tools span{padding:6px 12px;border-radius:16px;font-size:11px;border:1px solid var(--border);color:var(--tx2);cursor:pointer;transition:all .2s}
.welcome .tools span:hover{border-color:var(--a1);color:var(--a1)}
.msg{display:flex;gap:10px;animation:slideUp .3s ease-out;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.msg.user .avatar{background:linear-gradient(135deg,var(--a1),var(--a2))}
.msg.ai .avatar{background:var(--card);border:1px solid var(--border)}
.msg .bubble{padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.65;word-break:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#b45309,#dc2626);color:#fff;border-bottom-right-radius:3px}
.msg.ai .bubble{background:var(--card);color:var(--tx1);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg .bubble img{max-width:100%;max-height:400px;border-radius:8px;margin:8px 0;display:block;cursor:pointer;border:1px solid var(--border)}
.msg .tool-tag{font-size:10px;color:var(--a1);margin-bottom:4px;font-weight:600}
.msg .time{font-size:10px;color:var(--tx3);margin-top:4px}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.typing{display:flex;gap:5px;padding:4px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--tx3);animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1);opacity:1}}
.input-area{padding:16px 24px 20px;border-top:1px solid var(--border);background:rgba(13,16,37,.9);backdrop-filter:blur(20px);z-index:2}
.input-wrap{display:flex;gap:10px;background:var(--card);border-radius:16px;border:1px solid var(--border);padding:6px;transition:border-color .25s}
.input-wrap:focus-within{border-color:var(--a1);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:var(--tx1);font-size:14px;font-family:inherit;padding:8px 10px;resize:none;min-height:24px;max-height:120px}
.input-wrap textarea::placeholder{color:var(--tx3)}
.img-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:#fff;cursor:pointer;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s}
.img-btn:hover{border-color:var(--a3);background:#1e1e40}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;cursor:pointer;font-size:18px;flex-shrink:0;transition:all .25s;display:flex;align-items:center;justify-content:center}
.send-btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(245,158,11,.4)}
.send-btn:active{transform:scale(.95)}.send-btn:disabled{opacity:.4;cursor:not-allowed}
.input-hint{text-align:center;font-size:11px;color:var(--tx3);margin-top:8px}
@media(max-width:640px){.header{padding:10px 16px}.header .logo h1{font-size:15px}.chat{padding:16px}.input-area{padding:12px 16px 16px}.msg{max-width:92%}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<header class="header"><div class="logo"><div class="icon">🤖</div><h1>AI Agent 智能体</h1></div><div class="status"><span class="dot"></span> DeepSeek + Qwen</div></header>
<div class="chat" id="chat">
<div class="welcome" id="welcome"><div class="w-icon">🧠</div><h2>你好，我是AI智能助手</h2><p>集成了记账/日程/文生图/基金/招股书5大工具，支持图片上传和展示</p><div class="tools"><span class="t1" onclick="ask('今天买三体花了50元')">💰 记账本</span><span class="t2" onclick="ask('提醒我明天下午3点开会')">⏰ 日程提醒</span><span class="t3" onclick="ask('生成一张未来科技城市的图片')">🎨 文生图</span><span class="t4" onclick="ask('查询景顺长城基金的最新净值')">📊 基金问答</span><span class="t5" onclick="ask('湖南长远锂科股份有限公司的发起人有哪些')">📄 招股书问答</span></div></div>
</div>
<div class="input-area"><div class="input-wrap"><label class="img-btn" title="上传图片">📷<input type="file" id="imgFile" accept="image/*" onchange="onFileSelect(event)" style="display:none"></label><textarea id="qInput" rows="1" placeholder="输入问题或粘贴图片(Ctrl+V)..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send-btn" id="sendBtn" onclick="send()">➤</button></div><div id="imgPreview" style="display:none;margin-top:8px;position:relative;max-width:120px"></div><div class="input-hint">Enter发送 · 可粘贴/上传图片 · 支持人脸旋转 | 记账/日程/文生图/基金/招股书</div></div>

<script>
var chat=document.getElementById('chat'),input=document.getElementById('qInput'),
    btn=document.getElementById('sendBtn'),welcome=document.getElementById('welcome'),
    imgFile=document.getElementById('imgFile'),imgPreview=document.getElementById('imgPreview'),
    busy=false,sid='s'+Date.now(),pendingImg=null;
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
input.focus();
function ask(q){input.value=q;send()}

function onFileSelect(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(ev){setImg(ev.target.result.split(',')[1],f.name)};r.readAsDataURL(f);
}
function onPaste(e){
    var items=e.clipboardData.items;
    for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')===0){var f=items[i].getAsFile();var r=new FileReader();r.onload=function(ev){setImg(ev.target.result.split(',')[1],'粘贴图片')};r.readAsDataURL(f);break}}
}
function setImg(b64,name){
    pendingImg=b64;imgPreview.style.display='block';
    var h='<img src="data:image/png;base64,'+b64+'" style="max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--border)">';
    h+='<span style="position:absolute;top:-8px;right:-8px;cursor:pointer;font-size:16px;background:red;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px" onclick="pendingImg=null;imgPreview.style.display=\'none\'">x</span>';
    h+='<div style="font-size:10px;color:var(--tx3)">'+name+'</div>';
    imgPreview.innerHTML=h;
}

async function send(){
    if(busy)return;var q=input.value.trim();if(!q && !pendingImg)return;
    if(welcome)welcome.style.display='none';
    if(pendingImg){addMsg('user',q||'请处理这张图片',0,null,pendingImg)}
    else{addMsg('user',q)}
    input.value='';input.style.height='auto';
    var lid=addLoading();busy=true;btn.disabled=true;
    try{
        var body,hdrs={'Content-Type':'application/json','Cache-Control':'no-cache'};
        if(pendingImg){body=JSON.stringify({question:q||'请处理这张图片',image:pendingImg,session:sid});pendingImg=null;imgPreview.style.display='none';imgFile.value='';}
        else{body=JSON.stringify({question:q,session:sid})}
        var r=await fetch('/api/chat?_='+Date.now(),{method:'POST',headers:hdrs,body:body});
        var d=await r.json();removeLoading(lid);
        var text=(d.tool?'【'+d.tool+'】\n':'')+(d.error?'⚠️ '+d.error:d.answer);
        // 如果有生成/编辑的图片，附加到消息中
        if(d.images && d.images.length>0){
            for(var i=0;i<d.images.length;i++){
                text+='\n![生成图片]('+d.images[i]+')';
            }
        }
        addMsg('ai',text,d.elapsed,d.tool);
    }catch(e){removeLoading(lid);addMsg('ai','⚠️ 连接失败: '+e.message)}
    busy=false;btn.disabled=false;input.focus();
}

function addMsg(role,text,elapsed,tool,imgB64){
    var d=document.createElement('div');d.className='msg '+role;
    var a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'👤':'🤖';
    var b=document.createElement('div');b.className='bubble';
    if(role==='ai'&&tool){var tag=document.createElement('div');tag.className='tool-tag';tag.textContent='🔧 '+tool;b.appendChild(tag)}
    if(imgB64){var im=document.createElement('img');im.src='data:image/png;base64,'+imgB64;im.style.cssText='max-width:200px;max-height:200px;border-radius:8px;margin-bottom:6px;display:block';b.appendChild(im)}
    var imgMD=/!\[([^\]]*)\]\(([^)]+)\)/g,imgURL=/(https?:\/\/\S+\.(?:png|jpg|jpeg|gif|webp)(?:\?\S*)?)/gi;
    var parts=[],last=0,hasMD=imgMD.test(text);imgMD.lastIndex=0;
    if(hasMD){var m;while((m=imgMD.exec(text))!==null){if(m.index>last)parts.push({t:text.slice(last,m.index)});parts.push({i:m[2]});last=m.index+m[0].length;}if(last<text.length)parts.push({t:text.slice(last)});}
    else if(imgURL.test(text)){imgURL.lastIndex=0;var m2;while((m2=imgURL.exec(text))!==null){if(m2.index>last)parts.push({t:text.slice(last,m2.index)});parts.push({i:m2[0]});last=m2.index+m2[0].length;}if(last<text.length)parts.push({t:text.slice(last)});}
    if(parts.length>0){for(var i=0;i<parts.length;i++){var p=parts[i];if(p.t)b.appendChild(document.createTextNode(p.t));if(p.i){var img=document.createElement('img');img.src=p.i;img.onclick=function(){window.open(this.src)};img.onerror=function(){this.outerHTML='[图]'};b.appendChild(img)}}}
    else if(!imgB64||(text&&text!='请处理这张图片')){b.appendChild(document.createTextNode(text))}
    var tt=document.createElement('div');tt.className='time';var n=new Date();tt.textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+(elapsed!==undefined?' + '+elapsed+'s':'');
    var body=document.createElement('div');body.appendChild(b);body.appendChild(tt);d.appendChild(a);d.appendChild(body);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function addLoading(){var d=document.createElement('div');d.className='msg ai';d.id='load-'+Date.now();var a=document.createElement('div');a.className='avatar';a.textContent='🤖';var b=document.createElement('div');b.className='bubble';b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';var body=document.createElement('div');body.appendChild(b);d.appendChild(a);d.appendChild(body);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d.id;}
function removeLoading(id){var e=document.getElementById(id);if(e)e.remove()}
</script>
</body>
</html>
