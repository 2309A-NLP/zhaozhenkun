<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LightRAG 金融文档智能问答系统 — 架构图</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f1117; color:#e0e0e0; font-family:'Segoe UI','Microsoft YaHei',sans-serif; min-height:100vh; padding:30px; }
h1 { text-align:center; font-size:26px; color:#fff; margin-bottom:8px; letter-spacing:2px; }
.subtitle { text-align:center; color:#888; font-size:13px; margin-bottom:36px; }
svg { display:block; margin:0 auto; }

/* ========== 卡片 ========== */
.card { cursor:default; }
.card rect { rx:10; ry:10; fill:#1a1d27; stroke:#2a2d3a; stroke-width:1.5; transition:all .25s; }
.card:hover rect { stroke:#4f8cff; stroke-width:2; filter:drop-shadow(0 0 8px rgba(79,140,255,.35)); }
.card text { font-family:'Segoe UI','Microsoft YaHei',sans-serif; }

/* 分类色条 */
.cat-design rect { stroke:#f5a623; }
.cat-design .bar { fill:#f5a623; }
.cat-dev rect { stroke:#4f8cff; }
.cat-dev .bar { fill:#4f8cff; }
.cat-test rect { stroke:#e74c8b; }
.cat-test .bar { fill:#e74c8b; }
.cat-deploy rect { stroke:#00d4aa; }
.cat-deploy .bar { fill:#00d4aa; }
.cat-data rect { stroke:#8b5cf6; }
.cat-data .bar { fill:#8b5cf6; }

/* 连线 */
.link { fill:none; stroke-width:2; marker-end:url(#arrow); }
.link-data { stroke:#4f8cff; }
.link-flow { stroke:#00d4aa; }
.link-eval { stroke:#e74c8b; stroke-dasharray:6 3; }
.link-config { stroke:#f5a623; stroke-dasharray:4 3; opacity:.5; }
.link-llm { stroke:#8b5cf6; stroke-dasharray:5 3; }

/* 流程标签 */
.flow-label { font-size:11px; fill:#aaa; font-family:'Segoe UI','Microsoft YaHei',sans-serif; }

/* 图例 */
.legend { display:flex; justify-content:center; gap:28px; margin-top:24px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:#aaa; }
.legend-dot { width:12px; height:12px; border-radius:3px; }
</style>
</head>
<body>

<h1>LightRAG 金融文档智能问答系统</h1>
<p class="subtitle">rag工单12 · BGE-M3 · 五层目录架构（设计 / 研发 / 测试 / 优化 / 部署）</p>

<svg width="980" height="720" viewBox="0 0 980 720">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4f8cff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00d4aa"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e74c8b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f5a623"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151822"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="980" height="720" fill="url(#bg-grad)" rx="12"/>

  <!-- ==================== 区域标题 ==================== -->
  <!-- 输入区 -->
  <text x="70" y="40" fill="#8b5cf6" font-size="12" font-weight="600" letter-spacing="1">📥 数据输入</text>
  <!-- 处理流水线 -->
  <text x="70" y="165" fill="#4f8cff" font-size="12" font-weight="600" letter-spacing="1">⚙️ 研发模块 — 处理流水线</text>
  <!-- 检索+生成 -->
  <text x="70" y="360" fill="#00d4aa" font-size="12" font-weight="600" letter-spacing="1">🔍 检索 & 生成</text>
  <!-- 评估 -->
  <text x="670" y="360" fill="#e74c8b" font-size="12" font-weight="600" letter-spacing="1">📊 评估对比</text>
  <!-- 部署 -->
  <text x="70" y="545" fill="#00d4aa" font-size="12" font-weight="600" letter-spacing="1">🚀 部署入口</text>

  <!-- ==================== 数据层 ==================== -->
  <!-- PDF文件 -->
  <g class="card cat-data" transform="translate(70,55)">
    <rect width="150" height="70"/>
    <rect class="bar" x="0" y="0" width="4" height="70" rx="2"/>
    <text x="75" y="30" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">📄 PDF 文件</text>
    <text x="75" y="50" text-anchor="middle" fill="#8b5cf6" font-size="11">招股说明书 ×2</text>
  </g>

  <!-- 缓存 -->
  <g class="card cat-data" transform="translate(780,55)">
    <rect width="150" height="70"/>
    <rect class="bar" x="0" y="0" width="4" height="70" rx="2"/>
    <text x="75" y="30" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">💾 缓存层</text>
    <text x="75" y="50" text-anchor="middle" fill="#8b5cf6" font-size="10">cache/ + output/</text>
  </g>

  <!-- ==================== 设计层 ==================== -->
  <g class="card cat-design" transform="translate(780,180)">
    <rect width="150" height="80"/>
    <rect class="bar" x="0" y="0" width="4" height="80" rx="2"/>
    <text x="75" y="28" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">⚙ config.py</text>
    <text x="75" y="48" text-anchor="middle" fill="#f5a623" font-size="10">设计层</text>
    <text x="75" y="66" text-anchor="middle" fill="#888" font-size="10">全局配置 / 路径 / 密钥</text>
  </g>

  <!-- ==================== 研发层 — 流水线 ==================== -->
  <!-- pdf_parser -->
  <g class="card cat-dev" transform="translate(70,180)">
    <rect width="140" height="65"/>
    <rect class="bar" x="0" y="0" width="4" height="65" rx="2"/>
    <text x="70" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">pdf_parser</text>
    <text x="70" y="45" text-anchor="middle" fill="#4f8cff" font-size="10">PyMuPDF 解析</text>
    <text x="70" y="58" text-anchor="middle" fill="#666" font-size="9">逐页提取文本</text>
  </g>

  <!-- text_chunker -->
  <g class="card cat-dev" transform="translate(240,180)">
    <rect width="140" height="65"/>
    <rect class="bar" x="0" y="0" width="4" height="65" rx="2"/>
    <text x="70" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">text_chunker</text>
    <text x="70" y="45" text-anchor="middle" fill="#4f8cff" font-size="10">重叠分块</text>
    <text x="70" y="58" text-anchor="middle" fill="#666" font-size="9">chunk_size + overlap</text>
  </g>

  <!-- embedder -->
  <g class="card cat-dev" transform="translate(410,180)">
    <rect width="140" height="65"/>
    <rect class="bar" x="0" y="0" width="4" height="65" rx="2"/>
    <text x="70" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">embedder</text>
    <text x="70" y="45" text-anchor="middle" fill="#4f8cff" font-size="10">BGE-M3 向量化</text>
    <text x="70" y="58" text-anchor="middle" fill="#666" font-size="9">FP16 · batch=2</text>
  </g>

  <!-- entity_extractor -->
  <g class="card cat-dev" transform="translate(240,275)">
    <rect width="140" height="65"/>
    <rect class="bar" x="0" y="0" width="4" height="65" rx="2"/>
    <text x="70" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">entity_extractor</text>
    <text x="70" y="45" text-anchor="middle" fill="#4f8cff" font-size="10">LLM 实体提取</text>
    <text x="70" y="58" text-anchor="middle" fill="#666" font-size="9">实体 + 关系 → JSON</text>
  </g>

  <!-- graph_builder -->
  <g class="card cat-dev" transform="translate(410,275)">
    <rect width="140" height="65"/>
    <rect class="bar" x="0" y="0" width="4" height="65" rx="2"/>
    <text x="70" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">graph_builder</text>
    <text x="70" y="45" text-anchor="middle" fill="#4f8cff" font-size="10">NetworkX 图谱</text>
    <text x="70" y="58" text-anchor="middle" fill="#666" font-size="9">BFS 邻居扩展</text>
  </g>

  <!-- llm_client -->
  <g class="card cat-dev" transform="translate(580,275)">
    <rect width="140" height="65"/>
    <rect class="bar" x="0" y="0" width="4" height="65" rx="2"/>
    <text x="70" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">llm_client</text>
    <text x="70" y="45" text-anchor="middle" fill="#8b5cf6" font-size="10">MiMo API 封装</text>
    <text x="70" y="58" text-anchor="middle" fill="#666" font-size="9">call_llm / call_llm_json</text>
  </g>

  <!-- ==================== 检索 & 生成 ==================== -->
  <!-- retriever -->
  <g class="card cat-dev" transform="translate(120,380)">
    <rect width="180" height="80"/>
    <rect class="bar" x="0" y="0" width="4" height="80" rx="2"/>
    <text x="90" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">retriever</text>
    <text x="90" y="45" text-anchor="middle" fill="#00d4aa" font-size="10">双模式检索</text>
    <text x="90" y="60" text-anchor="middle" fill="#666" font-size="9">RAG：纯向量余弦</text>
    <text x="90" y="74" text-anchor="middle" fill="#666" font-size="9">LightRAG：向量 + 图谱</text>
  </g>

  <!-- qa_generator -->
  <g class="card cat-dev" transform="translate(360,380)">
    <rect width="160" height="80"/>
    <rect class="bar" x="0" y="0" width="4" height="80" rx="2"/>
    <text x="80" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">qa_generator</text>
    <text x="80" y="45" text-anchor="middle" fill="#00d4aa" font-size="10">问答生成</text>
    <text x="80" y="60" text-anchor="middle" fill="#666" font-size="9">上下文拼接</text>
    <text x="80" y="74" text-anchor="middle" fill="#666" font-size="9">MiMo 生成回答</text>
  </g>

  <!-- evaluator -->
  <g class="card cat-test" transform="translate(670,380)">
    <rect width="160" height="80"/>
    <rect class="bar" x="0" y="0" width="4" height="80" rx="2"/>
    <text x="80" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">evaluator</text>
    <text x="80" y="45" text-anchor="middle" fill="#e74c8b" font-size="10">测试层 · 4维评估</text>
    <text x="80" y="60" text-anchor="middle" fill="#666" font-size="9">相关性/完整性/准确性/流畅性</text>
    <text x="80" y="74" text-anchor="middle" fill="#666" font-size="9">RAG vs LightRAG 对比</text>
  </g>

  <!-- ==================== 部署层 ==================== -->
  <!-- 0_run.py 入口 -->
  <g class="card cat-deploy" transform="translate(120,500)">
    <rect width="150" height="80"/>
    <rect class="bar" x="0" y="0" width="4" height="80" rx="2"/>
    <text x="75" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">0_run.py</text>
    <text x="75" y="45" text-anchor="middle" fill="#00d4aa" font-size="10">主入口</text>
    <text x="75" y="60" text-anchor="middle" fill="#666" font-size="9">默认 → Web 对话</text>
    <text x="75" y="74" text-anchor="middle" fill="#666" font-size="9">--pipeline → 评估</text>
  </g>

  <!-- web_app -->
  <g class="card cat-deploy" transform="translate(330,500)">
    <rect width="150" height="80"/>
    <rect class="bar" x="0" y="0" width="4" height="80" rx="2"/>
    <text x="75" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">web_app.py</text>
    <text x="75" y="45" text-anchor="middle" fill="#00d4aa" font-size="10">Flask Web 对话</text>
    <text x="75" y="60" text-anchor="middle" fill="#666" font-size="9">延迟加载 · 秒开</text>
    <text x="75" y="74" text-anchor="middle" fill="#666" font-size="9">RAG / LightRAG 切换</text>
  </g>

  <!-- run.py -->
  <g class="card cat-deploy" transform="translate(540,500)">
    <rect width="150" height="80"/>
    <rect class="bar" x="0" y="0" width="4" height="80" rx="2"/>
    <text x="75" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">run.py</text>
    <text x="75" y="45" text-anchor="middle" fill="#00d4aa" font-size="10">评估流水线</text>
    <text x="75" y="60" text-anchor="middle" fill="#666" font-size="9">解析→分块→编码→</text>
    <text x="75" y="74" text-anchor="middle" fill="#666" font-size="9">提取→构图→检索→评估</text>
  </g>

  <!-- 用户 -->
  <g class="card" transform="translate(750,510)">
    <rect width="120" height="60" fill="#1a1d27" stroke="#fff" stroke-width="1" opacity=".6"/>
    <text x="60" y="28" text-anchor="middle" fill="#fff" font-size="14">👤 用户</text>
    <text x="60" y="46" text-anchor="middle" fill="#aaa" font-size="10">浏览器问答</text>
  </g>

  <!-- ==================== 连线 ==================== -->
  <!-- 数据流：PDF → parser -->
  <line x1="145" y1="125" x2="140" y2="178" class="link" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>
  <!-- parser → chunker -->
  <line x1="210" y1="212" x2="238" y2="212" class="link-data" marker-end="url(#arrow-blue)"/>
  <text x="224" y="206" class="flow-label" text-anchor="middle">分块</text>
  <!-- chunker → embedder -->
  <line x1="380" y1="212" x2="408" y2="212" class="link-data" marker-end="url(#arrow-blue)"/>
  <text x="394" y="206" class="flow-label" text-anchor="middle">编码</text>
  <!-- chunker → entity_extractor -->
  <line x1="310" y1="245" x2="310" y2="273" class="link-data" marker-end="url(#arrow-blue)"/>
  <text x="325" y="262" class="flow-label">提取</text>
  <!-- entity → graph -->
  <line x1="380" y1="307" x2="408" y2="307" class="link-data" marker-end="url(#arrow-blue)"/>
  <text x="394" y="300" class="flow-label" text-anchor="middle">构图</text>
  <!-- llm_client ← entity_extractor -->
  <line x1="520" y1="307" x2="578" y2="307" class="link-llm" marker-end="url(#arrow-purple)"/>
  <text x="549" y="300" class="flow-label" text-anchor="middle">API</text>
  <!-- llm_client ← qa_generator -->
  <line x1="520" y1="420" x2="578" y2="340" class="link-llm" marker-end="url(#arrow-purple)"/>
  <!-- embedder → retriever -->
  <line x1="480" y1="245" x2="210" y2="378" class="link-flow" marker-end="url(#arrow-green)"/>
  <!-- graph → retriever -->
  <line x1="410" y1="340" x2="260" y2="378" class="link-flow" marker-end="url(#arrow-green)"/>
  <!-- retriever → qa_generator -->
  <line x1="300" y1="420" x2="358" y2="420" class="link-flow" marker-end="url(#arrow-green)"/>
  <text x="329" y="414" class="flow-label" text-anchor="middle">上下文</text>
  <!-- qa_generator → evaluator (虚线) -->
  <line x1="520" y1="420" x2="668" y2="420" class="link-eval" marker-end="url(#arrow-pink)"/>
  <text x="594" y="414" class="flow-label" text-anchor="middle">RAG vs LightRAG</text>
  <!-- config → 各模块 (淡橙色虚线) -->
  <line x1="780" y1="220" x2="550" y2="212" class="link-config" marker-end="url(#arrow-orange)"/>
  <line x1="780" y1="230" x2="380" y2="307" class="link-config" marker-end="url(#arrow-orange)"/>
  <line x1="780" y1="240" x2="550" y2="340" class="link-config" marker-end="url(#arrow-orange)"/>
  <!-- 0_run → web_app / run -->
  <line x1="270" y1="540" x2="328" y2="540" class="link-flow" marker-end="url(#arrow-green)"/>
  <line x1="270" y1="555" x2="538" y2="540" class="link-flow" marker-end="url(#arrow-green)"/>
  <!-- web_app → 用户 -->
  <line x1="480" y1="540" x2="748" y2="540" class="link-flow" marker-end="url(#arrow-green)"/>
  <!-- 缓存 ← embedder/graph -->
  <line x1="480" y1="200" x2="778" y2="90" class="link" stroke="#8b5cf6" marker-end="url(#arrow-purple)" stroke-dasharray="5 3"/>
  <line x1="480" y1="300" x2="778" y2="100" class="link" stroke="#8b5cf6" marker-end="url(#arrow-purple)" stroke-dasharray="5 3"/>

  <!-- ==================== 优化层标签 ==================== -->
  <g transform="translate(780,380)">
    <rect width="150" height="80" rx="10" ry="10" fill="#1a1d27" stroke="#555" stroke-width="1" stroke-dasharray="6 3" opacity=".5"/>
    <text x="75" y="35" text-anchor="middle" fill="#666" font-size="13" font-weight="600">🔧 优化层</text>
    <text x="75" y="55" text-anchor="middle" fill="#555" font-size="10">暂空 · 预留扩展</text>
    <text x="75" y="70" text-anchor="middle" fill="#555" font-size="9">参数调优 / 缓存策略</text>
  </g>

  <!-- ==================== 底部技术栈 ==================== -->
  <g transform="translate(0,630)">
    <rect width="980" height="80" fill="#12141c" rx="0"/>
    <text x="490" y="22" text-anchor="middle" fill="#555" font-size="11" letter-spacing="1">技术栈</text>
    <text x="100" y="50" text-anchor="middle" fill="#8b5cf6" font-size="11">PyMuPDF</text>
    <text x="250" y="50" text-anchor="middle" fill="#4f8cff" font-size="11">BGE-M3 · sentence-transformers</text>
    <text x="450" y="50" text-anchor="middle" fill="#00d4aa" font-size="11">NetworkX · NumPy</text>
    <text x="620" y="50" text-anchor="middle" fill="#f5a623" font-size="11">MiMo API (v2.5)</text>
    <text x="780" y="50" text-anchor="middle" fill="#e74c8b" font-size="11">Flask · D3.js</text>
    <text x="490" y="70" text-anchor="middle" fill="#444" font-size="10">RTX 5060 8GB · FP16 · batch=2 · seq=1024</text>
  </g>
</svg>

<!-- 图例 -->
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#f5a623"></div>设计</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4f8cff"></div>研发</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e74c8b"></div>测试</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00d4aa"></div>部署</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>数据 / 外部服务</div>
</div>

</body>
</html>
