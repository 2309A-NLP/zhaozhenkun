<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 对话系统 - 登录</title>
    <style>
        :root {
            --bg: #f6efe5;
            --bg2: #eef7f3;
            --panel: rgba(255, 255, 255, 0.92);
            --line: rgba(15, 23, 42, 0.08);
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --accent: #ea580c;
            --danger: #dc2626;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 20%, rgba(15, 118, 110, 0.16), transparent 28%),
                radial-gradient(circle at 88% 10%, rgba(234, 88, 12, 0.12), transparent 24%),
                linear-gradient(135deg, var(--bg), var(--bg2));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--panel);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            padding: 28px;
        }

        .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            color: #fff;
            font-weight: 800;
            font-size: 26px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            margin-bottom: 16px;
        }

        h1 { font-size: 28px; margin-bottom: 8px; }
        .intro { color: var(--muted); line-height: 1.7; margin-bottom: 20px; }

        .tabs {
            display: flex;
            gap: 10px;
            padding: 6px;
            border-radius: 16px;
            background: rgba(255,255,255,.75);
            border: 1px solid var(--line);
            margin-bottom: 18px;
        }

        .tab, .btn, .nav-btn {
            border: none;
            cursor: pointer;
            font: inherit;
        }

        .tab {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
        }

        .tab.active {
            background: #fff;
            color: var(--text);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.06);
        }

        .form.hidden { display: none; }
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,.88);
            outline: none;
            font-size: 15px;
        }

        .field input:focus {
            border-color: rgba(15,118,110,.35);
            box-shadow: 0 0 0 4px rgba(15,118,110,.08);
        }

        .message {
            display: none;
            padding: 12px 14px;
            border-left: 4px solid var(--danger);
            border-radius: 12px;
            background: rgba(220,38,38,.08);
            color: var(--danger);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .message.success {
            border-left-color: var(--primary);
            color: var(--primary);
            background: rgba(15,118,110,.08);
        }

        .btn {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            color: #fff;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 16px 26px rgba(15,118,110,.2);
        }

        .btn:disabled { opacity: .7; cursor: not-allowed; }
        .loading { display: none; text-align: center; color: var(--muted); margin-top: 12px; font-size: 13px; }

        .demo {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .demo p, .nav p { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

        .demo button, .nav-btn {
            border-radius: 999px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,.85);
            color: var(--text);
            font-weight: 700;
        }

        .nav { margin-top: 18px; }
        .nav-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">R</div>
        <h1>RAG 对话系统</h1>
        <p class="intro">已接入短期记忆 Redis、长期记忆 Milvus、混合检索、多路召回、BGE-M3、BGE-Rerank、MySQL 与负载均衡监控。</p>

        <div class="tabs">
            <button id="loginTab" class="tab active" type="button">登录</button>
            <button id="registerTab" class="tab" type="button">注册</button>
        </div>

        <div id="messageBox" class="message"></div>

        <div id="loginForm" class="form">
            <div class="field">
                <label for="loginUsername">用户名</label>
                <input id="loginUsername" type="text" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="field">
                <label for="loginPassword">密码</label>
                <input id="loginPassword" type="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button id="loginBtn" class="btn" type="button">进入聊天</button>
        </div>

        <div id="registerForm" class="form hidden">
            <div class="field">
                <label for="regUsername">用户名</label>
                <input id="regUsername" type="text" placeholder="至少 3 个字符" autocomplete="username">
            </div>
            <div class="field">
                <label for="regEmail">邮箱</label>
                <input id="regEmail" type="email" placeholder="可不填" autocomplete="email">
            </div>
            <div class="field">
                <label for="regPassword">密码</label>
                <input id="regPassword" type="password" placeholder="至少 6 位" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="regConfirmPassword">确认密码</label>
                <input id="regConfirmPassword" type="password" placeholder="再次输入密码" autocomplete="new-password">
            </div>
            <button id="registerBtn" class="btn" type="button">创建账号</button>
        </div>

        <div id="loading" class="loading">请求处理中，请稍候...</div>

        <div class="demo">
            <p>快速体验</p>
            <button id="demoBtn" type="button">demo / 123456</button>
        </div>

        <div class="nav">
            <p>可视化页面</p>
            <div class="nav-grid">
                <button class="nav-btn" type="button" onclick="window.location.href='/qps'">QPS 面板</button>
                <button class="nav-btn" type="button" onclick="window.location.href='/performance'">性能测试</button>
                <button class="nav-btn" type="button" onclick="window.location.href='/stress'">压力测试</button>
                <button class="nav-btn" type="button" onclick="window.location.href='/retrieval'">混合检索</button>
                <button class="nav-btn" type="button" onclick="window.location.href='/load-balancer'">负载均衡</button>
                <button class="nav-btn" type="button" onclick="window.location.href='/combined-test'">综合测试</button>
            </div>
        </div>
    </div>

    <script>
        let isLoading = false;
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const messageBox = document.getElementById('messageBox');
        const loadingEl = document.getElementById('loading');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const demoBtn = document.getElementById('demoBtn');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const regUsername = document.getElementById('regUsername');
        const regEmail = document.getElementById('regEmail');
        const regPassword = document.getElementById('regPassword');
        const regConfirmPassword = document.getElementById('regConfirmPassword');

        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = type === 'success' ? 'message success' : 'message';
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
            messageBox.textContent = '';
            messageBox.className = 'message';
        }

        function setLoading(loading) {
            isLoading = loading;
            loadingEl.style.display = loading ? 'block' : 'none';
            loginBtn.disabled = loading;
            registerBtn.disabled = loading;
        }

        function switchTab(name) {
            hideMessage();
            const isLogin = name === 'login';
            loginTab.classList.toggle('active', isLogin);
            registerTab.classList.toggle('active', !isLogin);
            loginForm.classList.toggle('hidden', !isLogin);
            registerForm.classList.toggle('hidden', isLogin);
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `请求失败: ${response.status}`);
            }
            return data;
        }

        async function handleLogin() {
            if (isLoading) return;
            const username = loginUsername.value.trim();
            const password = loginPassword.value;
            if (!username) return showMessage('请输入用户名');
            if (!password) return showMessage('请输入密码');

            setLoading(true);
            hideMessage();
            try {
                const data = await fetchJson('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!data.success) throw new Error(data.error || '登录失败');
                window.location.href = '/chat';
            } catch (error) {
                showMessage(error.message || '登录失败');
            } finally {
                setLoading(false);
            }
        }

        async function handleRegister() {
            if (isLoading) return;
            const username = regUsername.value.trim();
            const email = regEmail.value.trim();
            const password = regPassword.value;
            const confirmPassword = regConfirmPassword.value;

            if (!username) return showMessage('请输入用户名');
            if (username.length < 3) return showMessage('用户名至少 3 个字符');
            if (password.length < 6) return showMessage('密码至少 6 位');
            if (password !== confirmPassword) return showMessage('两次密码输入不一致');

            setLoading(true);
            hideMessage();
            try {
                const data = await fetchJson('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                if (!data.success) throw new Error(data.error || '注册失败');
                switchTab('login');
                loginUsername.value = username;
                loginPassword.value = '';
                showMessage('注册成功，请登录', 'success');
            } catch (error) {
                showMessage(error.message || '注册失败');
            } finally {
                setLoading(false);
            }
        }

        async function checkLoggedIn() {
            try {
                const data = await fetchJson('/api/current_user');
                if (data.success && data.username && data.username !== 'guest') {
                    window.location.href = '/chat';
                }
            } catch (error) {
                console.debug(error.message);
            }
        }

        loginTab.addEventListener('click', () => switchTab('login'));
        registerTab.addEventListener('click', () => switchTab('register'));
        loginBtn.addEventListener('click', handleLogin);
        registerBtn.addEventListener('click', handleRegister);
        demoBtn.addEventListener('click', () => {
            switchTab('login');
            loginUsername.value = 'demo';
            loginPassword.value = '123456';
        });
        loginPassword.addEventListener('keydown', (event) => { if (event.key === 'Enter') handleLogin(); });
        regConfirmPassword.addEventListener('keydown', (event) => { if (event.key === 'Enter') handleRegister(); });
        checkLoggedIn();
    </script>
</body>
</html>
