<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RAG工单7评估报告(LLM版)</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;max-width:1100px;margin:20px auto;padding:20px;background:#f5f5f5}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:15px 0}
.metric{background:#f0f4ff;padding:10px;border-radius:8px;text-align:center}
.metric b{font-size:22px;color:#4CAF50;display:block}
.item{background:#fff;padding:12px 18px;margin:10px 0;border-radius:8px}
.score{display:inline-block;padding:2px 10px;border-radius:12px;color:#fff;font-size:12px}
.high{background:#4CAF50}.medium{background:#FF9800}.low{background:#f44336}
.issue{border-left:3px solid #f44336;padding:5px 10px;margin:3px 0;background:#fff5f5;font-size:13px}
.issue.ok{border-left-color:#4CAF50;background:#f5fff5}
pre{white-space:pre-wrap;background:#f8f8f8;padding:8px;border-radius:4px;font-size:13px}
.summary{background:#fff;padding:20px;border-radius:10px}
</style></head><body>
<h1>📊 RAG工单7 评估报告（LLM智能评分版）</h1>
<p>工单: 人工智能NLP-RAG-功能测试及评估 | 模型: MiMo | 评分: 0-10</p>
<div class="summary"><h2>总体指标</h2><div class="metrics">
<div class="metric"><b>{{avg_llm_overall}}</b><span>LLM综合</span></div>
<div class="metric"><b>{{avg_llm_relevance}}</b><span>相关性</span></div>
<div class="metric"><b>{{avg_llm_completeness}}</b><span>完整性</span></div>
<div class="metric"><b>{{avg_llm_accuracy}}</b><span>准确性</span></div>
<div class="metric"><b>{{avg_keyword_f1}}</b><span>关键词F1</span></div>
<div class="metric"><b>{{high_quality_ratio}}%</b><span>高质量(≥7)</span></div>
</div><h3>问题统计</h3><ul>{{issues_row}}</ul></div>{{rows}}
<p style="color:#999">生成: {{gen_time}}</p></body></html>
