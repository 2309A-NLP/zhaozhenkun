<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG工单7 功能测试及评估</title>
<style>
/* ===== 全局样式 ===== */
body { font-family: "Microsoft YaHei", -apple-system, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; color: #333; }
.container { max-width: 1200px; margin: 0 auto; }

/* ===== 页头 ===== */
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 30px 40px; border-radius: 12px; margin-bottom: 25px; }
.header h1 { margin: 0 0 5px; font-size: 26px; }
.header p { margin: 0; opacity: 0.9; font-size: 14px; }

/* ===== 指标卡片 ===== */
.summary-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
.card { background: #fff; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card .value { font-size: 28px; font-weight: 700; display: block; }
.card .label { font-size: 13px; color: #888; margin-top: 5px; }
.card.green .value { color: #4CAF50; }
.card.orange .value { color: #FF9800; }
.card.blue .value { color: #2196F3; }
.card.purple .value { color: #9C27B0; }

/* ===== 问题分析区 ===== */
.issues-bar { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.issues-bar h3 { margin: 0 0 15px; font-size: 16px; }
.issue-tags { display: flex; flex-wrap: wrap; gap: 10px; }
.issue-tag { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
.issue-tag.severe { background: #ffebee; color: #c62828; }
.issue-tag.warn { background: #fff3e0; color: #e65100; }
.issue-tag.ok { background: #e8f5e9; color: #2e7d32; }

/* ===== 结果列表 ===== */
.result-item { background: #fff; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
.result-header { padding: 15px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
.result-header:hover { background: #fafafa; }
.result-header .q-title { font-weight: 600; font-size: 15px; flex: 1; }
.scores { display: flex; gap: 12px; font-size: 13px; }
.score-badge { padding: 2px 10px; border-radius: 12px; color: #fff; font-size: 12px; }
.score-high { background: #4CAF50; }
.score-mid { background: #FF9800; }
.score-low { background: #f44336; }

.result-body { padding: 20px; display: none; }
.result-body.open { display: block; }
.section { margin-bottom: 15px; }
.section h4 { margin: 0 0 8px; font-size: 14px; color: #555; }
.section pre { background: #f8f8f8; padding: 12px; border-radius: 6px; font-family: inherit; white-space: pre-wrap; margin: 0; font-size: 14px; line-height: 1.6; }
.issues-list { margin: 10px 0; }
.issue-item { padding: 8px 12px; border-radius: 6px; margin: 5px 0; font-size: 13px; }
.issue-item.danger { background: #fff5f5; border-left: 3px solid #f44336; }
.issue-item.success { background: #f5fff5; border-left: 3px solid #4CAF50; }
.issue-item.warning { background: #fffdf5; border-left: 3px solid #FF9800; }

/* ===== 状态 ===== */
.loading { text-align: center; padding: 40px; color: #999; }
.error { text-align: center; padding: 40px; color: #f44336; }

/* ===== 导出按钮 ===== */
.export-btn { display: inline-block; padding: 10px 20px; background: #667eea; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 20px; }
.export-btn:hover { background: #5a6fd6; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📊 RAG项目 功能测试及评估</h1>
<p>工单编号: <span id="woId">{{ wo_id }}</span> | 10个CCF竞赛年报测试问题评估</p>
</div>

<!-- 摘要卡片 -->
<div id="summaryCards" class="summary-cards">
<div class="loading">加载中...</div>
</div>

<!-- 问题分析 -->
<div id="issuesBar" class="issues-bar" style="display:none">
<h3>⚠ 检索结果问题分析</h3>
<div id="issueTags" class="issue-tags"></div>
</div>

<!-- 问题列表 -->
<div id="resultList"></div>

<!-- 导出 -->
<button class="export-btn" onclick="exportReport()">📥 导出评估报告</button>
</div>

<script>
const API_BASE = '/api';

async function loadData() {
    try {
        const [resRes, sumRes] = await Promise.all([
            fetch(API_BASE + '/results').then(r => r.json()),
            fetch(API_BASE + '/summary').then(r => r.json()),
        ]);
        if (resRes.error) throw new Error(resRes.error);
        renderSummary(sumRes);
        renderIssues(sumRes);
        renderResults(resRes.item_results || []);
    } catch (e) {
        document.getElementById('summaryCards').innerHTML =
            `<div class="error">❌ 加载失败: ${e.message}<br>请先运行 run.py 生成评估数据</div>`;
    }
}

function renderSummary(sum) {
    const cards = [
        { val: sum.avg_f1?.toFixed(3) || '—', label: '平均F1分数', cls: 'green' },
        { val: sum.avg_recall?.toFixed(3) || '—', label: '平均召回率', cls: 'orange' },
        { val: sum.avg_accuracy?.toFixed(3) || '—', label: '平均准确率', cls: 'blue' },
        { val: (sum.high_quality_ratio * 100 || 0).toFixed(0) + '%', label: '高质量占比(F1≥0.6)', cls: 'purple' },
        { val: (sum.avg_response_time || 0).toFixed(1) + 's', label: '平均响应时间', cls: 'green' },
        { val: sum.total_questions || 0, label: '测试问题数', cls: 'blue' },
    ];
    document.getElementById('summaryCards').innerHTML = cards.map(c =>
        `<div class="card ${c.cls}"><span class="value">${c.val}</span><span class="label">${c.label}</span></div>`
    ).join('');
}

function renderIssues(sum) {
    const issues = sum.typical_problems || [];
    if (!issues.length) return;
    document.getElementById('issuesBar').style.display = 'block';
    document.getElementById('issueTags').innerHTML = issues.map((iss, i) => {
        const cls = i === 0 ? 'severe' : 'warn';
        return `<span class="issue-tag ${cls}">⚠ ${iss.issue} (${iss.count}次)</span>`;
    }).join('');
}

function renderResults(items) {
    if (!items || !items.length) {
        document.getElementById('resultList').innerHTML = '<div class="error">暂无评估数据</div>';
        return;
    }
    document.getElementById('resultList').innerHTML = items.map((item, idx) => {
        const f1 = item.f1 || 0;
        const cls = f1 >= 0.6 ? 'high' : f1 >= 0.3 ? 'mid' : 'low';
        const issuesHtml = (item.analysis || []).map(iss => {
            const issCls = iss.severity === '严重' ? 'danger' : iss.severity === '正常' ? 'success' : 'warning';
            return `<div class="issue-item ${issCls}">${iss.severity === '正常' ? '✅' : '⚠'} <strong>${iss.type}</strong>: ${iss.detail}</div>`;
        }).join('');

        return `
        <div class="result-item">
            <div class="result-header" onclick="toggleBody(${idx})">
                <span class="q-title">Q${item.question_id}: ${item.question?.substring(0, 60) || ''}</span>
                <div class="scores">
                    <span class="score-badge score-${cls}">F1=${f1.toFixed(3)}</span>
                    <span style="color:#888">▾</span>
                </div>
            </div>
            <div class="result-body" id="body-${idx}">
                <div class="section"><h4>📝 参考答案</h4><pre>${item.reference_answer || '无'}</pre></div>
                <div class="section"><h4>🤖 RAG生成回答</h4><pre>${item.generated_answer || '无'}</pre></div>
                <div class="section">
                    <h4>📊 评估指标</h4>
                    <p style="font-size:14px;color:#666">F1=${item.f1} | 准确率=${item.accuracy} | 召回率=${item.recall} | 文本相似度=${item.similarity} | 响应时间=${item.response_time}s</p>
                </div>
                <div class="section"><h4>🔍 问题分析</h4><div class="issues-list">${issuesHtml || '<p style="color:#999">无</p>'}</div></div>
            </div>
        </div>`;
    }).join('');
}

function toggleBody(idx) {
    const el = document.getElementById('body-' + idx);
    if (el) el.classList.toggle('open');
}

function exportReport() {
    const url = document.querySelector('a[href*="output"]');
    // 前端导出: 打开output目录下的评估报告
    window.open('/api/results', '_blank');
}

// 页面加载
loadData();
</script>
</body>
</html>
